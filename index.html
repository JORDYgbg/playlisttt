<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Jordy Vibes</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0c0c; --surf:#161616; --surf2:#1e1e1e;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --muted:rgba(255,255,255,.35); --text:#ede8e0;
  --accent:#c8b49a; --accent2:#e5d9c8;
  --sw:240px; --ph:80px; --hh:52px; --r:9px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}

/* ── APP SHELL ── */
.app{display:grid;
  grid-template-rows:var(--hh) 1fr var(--ph);
  grid-template-columns:var(--sw) 1fr;
  grid-template-areas:"hd hd""sb mn""pl pl";
  height:100dvh;}

/* ── HEADER ── */
header{grid-area:hd;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--border);
  background:rgba(12,12,12,.95);backdrop-filter:blur(24px);z-index:100;}
.logo{font-family:'Instrument Serif',serif;font-size:16px;color:var(--accent2);letter-spacing:.01em;}
.hcenter{flex:1;display:flex;justify-content:center;}
.sbar{display:flex;align-items:center;gap:8px;background:var(--surf);
  border:1px solid var(--border2);border-radius:8px;
  padding:0 14px;height:32px;width:min(260px,100%);transition:border-color .2s;}
.sbar:focus-within{border-color:var(--accent);}
.sbar input{background:transparent;border:none;outline:none;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:13px;width:100%;}
.sbar input::placeholder{color:var(--muted);}
.hright{display:flex;align-items:center;gap:10px;}
.upill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;}
.odot{width:6px;height:6px;background:#5cb85c;border-radius:50%;flex-shrink:0;}
.mbtn{display:none;background:none;border:none;color:var(--muted);cursor:pointer;
  padding:6px;border-radius:6px;transition:background .15s;}
.mbtn:hover{background:var(--surf);}

/* ── SIDEBAR ── */
aside{grid-area:sb;background:#111;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .28s cubic-bezier(.4,0,.2,1);}
.ss{flex:1;overflow-y:auto;padding-bottom:16px;}
.ss::-webkit-scrollbar{width:0;}
.ns{padding:14px 12px 4px;}
.nsl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:0 8px;margin-bottom:5px;}
.ni{display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);
  font-size:13px;transition:background .12s,color .12s,transform .15s;}
.ni:hover{background:var(--surf);color:var(--text);transform:translateX(2px);}
.ni.act{background:rgba(200,180,154,.1);color:var(--accent2);}
.bdg{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--surf2);color:var(--muted);}
.sfoot{padding:10px 14px;border-top:1px solid var(--border);
  font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}
.expbtn{cursor:pointer;transition:color .15s;}.expbtn:hover{color:var(--accent);}

/* ── OVERLAY ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:299;
  backdrop-filter:blur(3px);transition:opacity .25s;}

/* ── MAIN ── */
main{grid-area:mn;overflow-y:auto;scroll-behavior:smooth;}
main::-webkit-scrollbar{width:4px;}
main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}

/* ── VIEWS ── */
.view{display:none;}.view.act{display:block;}

/* ── HOME ── */
.hero{padding:48px 36px 40px;border-bottom:1px solid var(--border);}
.hlbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.htitle{font-family:'Instrument Serif',serif;font-size:44px;line-height:1.05;color:var(--accent2);}
.hsub{font-size:14px;color:var(--muted);margin-top:8px;font-weight:300;}
.sec{padding:30px 36px;}.sec+.sec{padding-top:0;}
.seclbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.gc{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 14px;cursor:pointer;transition:border-color .2s,transform .18s;}
.gc:hover{border-color:var(--accent);transform:translateY(-3px);}
.gltr{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:500;margin-bottom:10px;}
.gname{font-size:12px;font-weight:500;color:var(--text);}
.gcnt{font-size:11px;color:var(--muted);margin-top:3px;}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.mc{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 8px;cursor:pointer;text-align:center;transition:border-color .2s,transform .18s;}
.mc:hover{border-color:var(--accent);transform:translateY(-3px);}
.mdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:500;margin:0 auto 8px;}
.mlbl{font-size:11px;color:var(--muted);}

/* ── LIST HEADER ── */
.lhd{position:sticky;top:0;background:rgba(12,12,12,.96);backdrop-filter:blur(18px);
  padding:20px 36px;border-bottom:1px solid var(--border);z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.bbtn{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--muted);
  font-size:12px;transition:color .15s;background:none;border:none;}
.bbtn:hover{color:var(--text);}
.vtitle{font-family:'Instrument Serif',serif;font-size:28px;color:var(--accent2);line-height:1;margin-top:7px;}
.vsub{font-size:11px;color:var(--muted);margin-top:4px;}
.pabtn{display:flex;align-items:center;gap:7px;background:var(--accent);color:#0c0c0c;
  border:none;border-radius:7px;padding:10px 20px;font-family:'DM Sans',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s,transform .15s;white-space:nowrap;}
.pabtn:hover{opacity:.85;transform:scale(1.02);}

/* ── SONG LIST ── */
.swrp{padding:10px 36px 28px;}
.sr{display:grid;grid-template-columns:28px 1fr auto;align-items:center;
  gap:14px;padding:9px 10px;border-radius:7px;cursor:pointer;
  transition:background .12s;position:relative;}
.sr:hover{background:var(--surf);}
.sr:hover .sn{visibility:hidden;}
.sr:hover .spb{visibility:visible;}
.sr.on{background:rgba(200,180,154,.07);}
.sr.on .stl{color:var(--accent);}
.nc{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.sn{font-size:11px;color:var(--muted);position:absolute;}
.spb{position:absolute;visibility:hidden;background:none;border:none;
  cursor:pointer;color:var(--text);font-size:12px;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.stl{font-size:13px;color:var(--text);}
.sat{font-size:11px;color:var(--muted);margin-top:2px;}
.stgs{display:flex;gap:3px;flex-wrap:wrap;}
.stg{font-size:9px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
.allhd{padding:36px 36px 14px;}
.alltl{font-family:'Instrument Serif',serif;font-size:34px;color:var(--accent2);}
.allsb{font-size:12px;color:var(--muted);margin-top:5px;}
.empty{padding:50px;text-align:center;color:var(--muted);font-size:13px;}

/* ── PLAYER ─────────────────────────────────────── */
#pbar{
  grid-area:pl;
  background:rgba(16,16,16,.98);
  backdrop-filter:blur(28px);
  border-top:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;gap:12px;z-index:200;
  transition:opacity .3s;
}
#pbar.idle{opacity:.3;pointer-events:none;}

/* player info */
.pi{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
.pthb{width:42px;height:42px;flex-shrink:0;background:var(--surf);
  border:1px solid var(--border2);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:500;color:var(--accent);font-family:'DM Sans',sans-serif;}
.pmeta{min-width:0;}
.ptl{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.pat{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;margin-top:2px;}

/* player controls (center) */
.pc{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0;}
.crow{display:flex;align-items:center;gap:16px;}
.cbtn{background:none;border:none;color:var(--muted);cursor:pointer;
  padding:5px;display:flex;align-items:center;border-radius:6px;
  transition:color .15s,background .15s,transform .1s;}
.cbtn:hover{color:var(--text);background:var(--surf);transform:scale(1.1);}
.pmain{width:36px;height:36px;border-radius:50%;background:var(--accent2);
  border:none;color:#0c0c0c;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,opacity .15s;flex-shrink:0;}
.pmain:hover{transform:scale(1.09);}
.pmain:active{transform:scale(.94);opacity:.85;}

/* progress row */
.prow{display:flex;align-items:center;gap:9px;width:min(400px,100%);}
.ptm{font-size:10px;color:var(--muted);min-width:30px;font-variant-numeric:tabular-nums;flex-shrink:0;}
.ptr{flex:1;height:3px;background:rgba(255,255,255,.12);border-radius:2px;
  position:relative;cursor:pointer;}
.ptr:hover .pthm{opacity:1;}
.pfill{height:100%;background:var(--accent);border-radius:2px;width:0%;pointer-events:none;}
.pthm{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;background:var(--accent2);
  left:0%;opacity:0;pointer-events:none;transition:opacity .2s;}

/* player right */
.pr{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end;}
.vwp{display:flex;align-items:center;gap:7px;}
.vsl{-webkit-appearance:none;width:72px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.12);outline:none;cursor:pointer;}
.vsl::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:var(--accent2);cursor:pointer;}
.cplb{background:none;border:none;color:var(--muted);cursor:pointer;
  padding:5px;border-radius:6px;display:flex;align-items:center;
  transition:color .15s,background .15s;}
.cplb:hover{color:var(--text);background:var(--surf);}

/* ── MOBILE ─────────────────────────────────────── */
@media(max-width:700px){
  :root{--ph:90px;--hh:50px;}
  .app{
    grid-template-rows:var(--hh) 1fr var(--ph);
    grid-template-columns:1fr;
    grid-template-areas:"hd""mn""pl";
  }
  aside{
    position:fixed;top:0;left:0;bottom:0;
    width:260px;z-index:300;
    transform:translateX(-100%);
  }
  aside.open{transform:translateX(0);}
  .ov{display:block;}
  .ov.hidden{display:none;}
  .mbtn{display:flex;}
  .hcenter{display:none;}
  .upill .upname{display:none;}
  /* hero */
  .hero{padding:28px 20px 24px;}.htitle{font-size:30px;}
  .sec{padding:20px;}.sec+.sec{padding-top:0;}
  .ggrid{grid-template-columns:repeat(2,1fr);}
  .mgrid{grid-template-columns:repeat(3,1fr);}
  /* list */
  .lhd{padding:14px 20px;}
  .swrp{padding:10px 16px 24px;}
  .sr{grid-template-columns:24px 1fr;}
  .stgs{display:none;}
  .allhd{padding:24px 20px 10px;}
  /* player mobile — full horizontal bar, everything visible */
  #pbar{
    flex-direction:column;
    padding:10px 16px 14px;
    gap:8px;
    align-items:stretch;
  }
  .pi{gap:10px;}
  .ptl,.pat{max-width:calc(100vw - 160px);}
  .pc{gap:6px;width:100%;}
  .prow{width:100%;max-width:100%;}
  .pr{display:none;}/* volume/close hidden on mobile — use system controls */
  .crow{gap:20px;}
  .pmain{width:38px;height:38px;}
  /* top row: info + play controls side by side */
  #pbar{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px 12px;padding:10px 16px 12px;}
  .pi{grid-column:1;grid-row:1;align-self:center;}
  .crow{grid-column:2;grid-row:1;align-self:center;}
  .prow{grid-column:1/-1;grid-row:2;}
  .pc{display:contents;}/* flatten so crow and prow place into grid */
}

#ytwrp{position:fixed;bottom:200px;right:0;width:1px;height:1px;overflow:hidden;pointer-events:none;opacity:0;}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="mbtn" onclick="toggleSb()" aria-label="Menú">
      <svg width="18" height="13" viewBox="0 0 18 13" fill="none">
        <rect width="18" height="1.8" rx="0.9" fill="currentColor"/>
        <rect y="5.6" width="12" height="1.8" rx="0.9" fill="currentColor"/>
        <rect y="11.2" width="18" height="1.8" rx="0.9" fill="currentColor"/>
      </svg>
    </button>
    <div class="logo">Jordy Vibes</div>
  </div>
  <div class="hcenter">
    <div class="sbar">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="rgba(255,255,255,.3)" stroke-width="1.4"/>
        <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="rgba(255,255,255,.3)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input type="text" id="sinput" placeholder="Buscar canciones, artistas..." oninput="doSearch(this.value)"/>
    </div>
  </div>
  <div class="hright">
    <div class="upill">
      <div class="odot"></div>
      <span class="upname">Lesly · EC</span>
    </div>
  </div>
</header>

<!-- OVERLAY -->
<div class="ov hidden" id="ov" onclick="closeSb()"></div>

<!-- SIDEBAR -->
<aside id="sb">
  <div class="ss">
    <div class="ns">
      <div class="ni act" id="nav-home" onclick="showHome()">Inicio</div>
      <div class="ni" id="nav-all" onclick="showAll()">
        Todas las canciones <span class="bdg">100</span>
      </div>
    </div>
    <div class="ns"><div class="nsl">Géneros</div><div id="glist"></div></div>
    <div class="ns"><div class="nsl">Moods</div><div id="mlist"></div></div>
  </div>
  <div class="sfoot">
    <span>100 canciones</span>
    <span class="expbtn" onclick="alert('Demo: exportaría tu playlist a Spotify.')">Exportar →</span>
  </div>
</aside>

<!-- MAIN -->
<main id="main">

  <div id="hv" class="view act">
    <div class="hero">
      <div class="hlbl">Tu espacio</div>
      <div class="htitle" id="gtitle">Buenas noches,<br/>Lesly.</div>
      <div class="hsub" id="gsub">¿Qué mood traes hoy?</div>
    </div>
    <div class="sec"><div class="seclbl">Géneros</div><div class="ggrid" id="fg"></div></div>
    <div class="sec"><div class="seclbl">Moods</div><div class="mgrid" id="fm"></div></div>
  </div>

  <div id="lv" class="view">
    <div class="lhd">
      <div>
        <button class="bbtn" onclick="showHome()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8 1.5L3.5 6L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Volver
        </button>
        <div class="vtitle" id="vtl"></div>
        <div class="vsub" id="vsb"></div>
      </div>
      <button class="pabtn" onclick="playAll()">
        <svg width="9" height="11" viewBox="0 0 9 11" fill="currentColor"><path d="M0 0L9 5.5L0 11V0Z"/></svg>
        Reproducir todo
      </button>
    </div>
    <div class="swrp" id="sg"></div>
  </div>

  <div id="av" class="view">
    <div class="allhd"><div class="alltl">Todas las canciones</div><div class="allsb">100 canciones · Tu biblioteca</div></div>
    <div class="swrp" id="al"></div>
  </div>

  <div id="sv" class="view">
    <div class="lhd">
      <div>
        <button class="bbtn" onclick="showHome()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8 1.5L3.5 6L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Volver
        </button>
        <div class="vtitle" id="stl2">Resultados</div>
        <div class="vsub" id="ssb2"></div>
      </div>
    </div>
    <div class="swrp" id="sr2"></div>
  </div>

</main>

<!-- PLAYER -->
<div id="pbar" class="idle">
  <div class="pi">
    <div class="pthb" id="pthb">—</div>
    <div class="pmeta">
      <div class="ptl" id="ptl">—</div>
      <div class="pat" id="pat">Selecciona una canción</div>
    </div>
  </div>

  <div class="pc">
    <div class="crow">
      <button class="cbtn" onclick="prevS()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M2.5 2.5h1.6v11H2.5zM5.1 8L13 2.5v11L5.1 8z"/>
        </svg>
      </button>
      <button class="pmain" id="pmain" onclick="togglePlay()">
        <svg id="picon" width="12" height="13" viewBox="0 0 12 13" fill="currentColor">
          <path d="M0 0L12 6.5L0 13V0Z"/>
        </svg>
      </button>
      <button class="cbtn" onclick="nextS()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M13.5 2.5h-1.6v11h1.6zM10.9 8L3 2.5v11L10.9 8z"/>
        </svg>
      </button>
    </div>
    <div class="prow">
      <span class="ptm" id="tcur">0:00</span>
      <div class="ptr" id="ptr" onclick="seekTo(event)">
        <div class="pfill" id="pfill"></div>
        <div class="pthm" id="pthm"></div>
      </div>
      <span class="ptm" style="text-align:right" id="tdur">—</span>
    </div>
  </div>

  <div class="pr">
    <div class="vwp">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M1 4.5h2.5L6 2v9L3.5 8.5H1V4.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M8.5 3.5a4 4 0 010 6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <input type="range" class="vsl" id="vsl" min="0" max="100" value="80" oninput="setVol(this.value)"/>
    </div>
    <button class="cplb" onclick="closeP()">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
        <path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

</div><!-- .app -->

<div id="ytwrp"><div id="ytpl"></div></div>

<script>
/* ── DATA ── */
const S=[
  {id:1,  t:"Favorite Lie",                    a:"Lil Tecca",                    g:"Hip-Hop",    m:["energicas","nocturnas"],         y:"-2HhOtA2e5M"},
  {id:2,  t:"Overnight Celebrity",             a:"Twista ft. Miri Ben-Ari",      g:"Hip-Hop",    m:["chill","feliz"],                 y:"z3JmMF6dGGk"},
  {id:3,  t:"Pyramids",                        a:"Frank Ocean",                  g:"R&B",        m:["chill","nocturnas","tristes"],   y:"LjFrZMDEAA8"},
  {id:4,  t:"Every Breath You Take",           a:"The Police",                   g:"Rock",       m:["chill","nocturnas"],             y:"OMOGaugKpzs"},
  {id:5,  t:"Dancing in the Moonlight",        a:"Toploader",                    g:"Pop",        m:["feliz","energicas"],             y:"4rb8aOzo1qY"},
  {id:6,  t:"New N3on",                        a:"Playboi Carti",                g:"Hip-Hop",    m:["energicas","nocturnas"],         y:"mUip00JK_rU"},
  {id:7,  t:"New Light",                       a:"John Mayer",                   g:"Pop",        m:["chill","feliz"],                 y:"kvmBFLCGVYY"},

const MOODS={
  feliz:     {l:"Feliz",     c:"#e8c040"},
  chill:     {l:"Chill",     c:"#5aabb8"},
  nocturnas: {l:"Nocturnas", c:"#7b6bb0"},
  tristes:   {l:"Tristes",   c:"#8080a0"},
  energicas: {l:"Enérgicas", c:"#d05030"},
  romanticas:{l:"Románticas",c:"#c07878"},
  dance:     {l:"Dance",     c:"#48b870"},
}
const GC={"Hip-Hop":"#c8945a","R&B":"#c06878","Rock":"#6888c0","Pop":"#8888c0",
  "Latin":"#78b878","Electronic":"#5898c0","Funk":"#c0a048","Disco":"#b870a8",
  "New Wave":"#60a8b0","Classic":"#a08060"}
const genres=[...new Set(S.map(s=>s.g))]

/* ── STATE ── */
let yt=null,ytOk=false
let cur=null,q=[],qi=-1,playing=false
let tickId=null,fakeId=null

/* ── GREETING ── */
function greet(){
  const h=new Date().getHours()
  let p,sub
  if(h>=5&&h<12){p="Buenos días";sub="Arranca el día con buena vibra."}
  else if(h>=12&&h<19){p="Buenas tardes";sub="¿Qué mood traes esta tarde?"}
  else{p="Buenas noches";sub="¿Qué mood traes hoy?"}
  document.getElementById('gtitle').innerHTML=`${p},<br/>Lesly.`
  document.getElementById('gsub').textContent=sub
}

/* ── YOUTUBE ── */
function loadYT(){
  const sc=document.createElement('script')
  sc.src='https://www.youtube.com/iframe_api'
  document.body.appendChild(sc)
}
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('ytpl',{height:'1',width:'1',
    playerVars:{autoplay:0,controls:0,rel:0,playsinline:1},
    events:{onReady:()=>{ytOk=true},onStateChange:onSC}})
}
function onSC(e){
  if(e.data===YT.PlayerState.ENDED){nextS();return}
  if(e.data===YT.PlayerState.PLAYING){playing=true;updIcon();startTick()}
  if(e.data===YT.PlayerState.PAUSED){playing=false;updIcon();stopTick()}
}

/* ── PROGRESS ── */
function startTick(){stopTick();tickId=setInterval(tick,350)}
function stopTick(){clearInterval(tickId)}
function tick(){
  if(!yt||!yt.getDuration)return
  const d=yt.getDuration()||0,c=yt.getCurrentTime()||0
  if(!d)return
  setP((c/d)*100,c,d)
}
function setP(pct,c,d){
  document.getElementById('pfill').style.width=pct+'%'
  document.getElementById('pthm').style.left=pct+'%'
  document.getElementById('tcur').textContent=fmt(c)
  document.getElementById('tdur').textContent=fmt(d)
}
function fmt(s){const m=Math.floor(s/60),sc=Math.floor(s%60);return`${m}:${sc.toString().padStart(2,'0')}`}
function seekTo(e){
  if(!yt||!yt.getDuration)return
  const r=document.getElementById('ptr').getBoundingClientRect()
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))
  yt.seekTo(yt.getDuration()*pct,true)
}
function setVol(v){if(yt&&yt.setVolume)yt.setVolume(+v)}

/* ── PLAYBACK ── */
function playSong(idOrSong){
  const song=typeof idOrSong==='number'?S.find(s=>s.id===idOrSong):idOrSong
  if(!song)return
  cur=song
  document.getElementById('pbar').classList.remove('idle')
  document.getElementById('pthb').textContent=song.g[0]
  document.getElementById('pthb').style.color=GC[song.g]||'var(--accent)'
  document.getElementById('ptl').textContent=song.t
  document.getElementById('pat').textContent=song.a
  setP(0,0,0)
  document.getElementById('tdur').textContent='—'
  document.querySelectorAll('.sr').forEach(r=>r.classList.remove('on'))
  document.querySelector(`.sr[data-id="${song.id}"]`)?.classList.add('on')
  if(song.y&&ytOk){
    clearInterval(fakeId);stopTick()
    yt.loadVideoById(song.y)
    yt.setVolume(+document.getElementById('vsl').value)
    playing=true
  } else {
    playing=true;runFake(210)
  }
  updIcon()
}
function runFake(tot){
  stopTick();clearInterval(fakeId);let e=0
  document.getElementById('tdur').textContent=fmt(tot)
  fakeId=setInterval(()=>{
    if(!playing)return
    e++;setP((e/tot)*100,e,tot)
    if(e>=tot){clearInterval(fakeId);nextS()}
  },1000)
}
function togglePlay(){
  if(!cur)return
  if(cur.y&&ytOk){playing?yt.pauseVideo():yt.playVideo()}
  else{playing=!playing;updIcon()}
}
function updIcon(){
  const ic=document.getElementById('picon')
  if(playing){
    ic.setAttribute('viewBox','0 0 12 13')
    ic.innerHTML='<rect x="0" y="0" width="3.8" height="13" rx="1.2" fill="currentColor"/><rect x="8.2" y="0" width="3.8" height="13" rx="1.2" fill="currentColor"/>'
  } else {
    ic.setAttribute('viewBox','0 0 12 13')
    ic.innerHTML='<path d="M0 0L12 6.5L0 13V0Z"/>'
  }
}
function nextS(){
  if(!q.length)return;qi=(qi+1)%q.length;playSong(q[qi])
}
function prevS(){
  if(!q.length)return;qi=(qi-1+q.length)%q.length;playSong(q[qi])
}
function closeP(){
  if(ytOk&&yt.stopVideo)yt.stopVideo()
  stopTick();clearInterval(fakeId);playing=false;cur=null
  document.getElementById('pbar').classList.add('idle')
  document.getElementById('ptl').textContent='—'
  document.getElementById('pat').textContent='Selecciona una canción'
  document.getElementById('pthb').textContent='—'
  setP(0,0,0);document.getElementById('tdur').textContent='—'
  document.querySelectorAll('.sr').forEach(r=>r.classList.remove('on'))
  updIcon()
}
function playAll(){if(q.length){qi=0;playSong(q[0])}}
function qplay(id){
  const idx=q.findIndex(s=>s.id===id)
  if(idx!==-1)qi=idx
  playSong(id);closeSb()
}

/* ── RENDER ── */
function renderSidebar(){
  const gl=document.getElementById('glist');gl.innerHTML=''
  genres.forEach(g=>{
    const n=S.filter(s=>s.g===g).length
    const d=document.createElement('div');d.className='ni'
    d.innerHTML=`<span>${g}</span><span class="bdg">${n}</span>`
    d.onclick=()=>showGenre(g);gl.appendChild(d)
  })
  const ml=document.getElementById('mlist');ml.innerHTML=''
  Object.entries(MOODS).forEach(([k,mo])=>{
    const n=S.filter(s=>s.m.includes(k)).length
    const d=document.createElement('div');d.className='ni'
    d.innerHTML=`<span>${mo.l}</span><span class="bdg">${n}</span>`
    d.onclick=()=>showMood(k);ml.appendChild(d)
  })
}
function renderHome(){
  const fg=document.getElementById('fg');fg.innerHTML=''
  genres.forEach(g=>{
    const n=S.filter(s=>s.g===g).length,c=GC[g]||'#a09080'
    fg.innerHTML+=`<div class="gc" onclick="showGenre('${g}')">
      <div class="gltr" style="background:${c}20;color:${c}">${g[0]}</div>
      <div class="gname">${g}</div><div class="gcnt">${n} canciones</div></div>`
  })
  const fm=document.getElementById('fm');fm.innerHTML=''
  Object.entries(MOODS).forEach(([k,mo])=>{
    fm.innerHTML+=`<div class="mc" onclick="showMood('${k}')">
      <div class="mdot" style="background:${mo.c}25;color:${mo.c}">${mo.l[0]}</div>
      <div class="mlbl">${mo.l}</div></div>`
  })
}
function renderList(list,cid){
  const c=document.getElementById(cid);c.innerHTML=''
  if(!list.length){c.innerHTML='<div class="empty">Sin canciones aquí.</div>';return}
  list.forEach((song,i)=>{
    const row=document.createElement('div')
    row.className='sr';row.dataset.id=song.id
    row.innerHTML=`
      <div class="nc">
        <span class="sn">${i+1}</span>
        <button class="spb" onclick="event.stopPropagation();qplay(${song.id})">&#9654;</button>
      </div>
      <div>
        <div class="stl">${song.t}${!song.y?'<span style="font-size:9px;opacity:.3;margin-left:6px">sin audio</span>':''}</div>
        <div class="sat">${song.a}</div>
      </div>
      <div class="stgs">${song.m.map(mk=>`<span class="stg">${MOODS[mk]?.l||mk}</span>`).join('')}</div>`
    row.addEventListener('click',()=>qplay(song.id))
    c.appendChild(row)
  })
}

/* ── VIEWS ── */
function setView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('act'))
  document.getElementById(id).classList.add('act')
  document.getElementById('main').scrollTop=0
}
function setNav(id){
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('act'))
  if(id)document.getElementById(id)?.classList.add('act')
}
function showHome(){
  setView('hv');setNav('nav-home');q=[...S]
  document.getElementById('sinput').value='';closeSb()
}
function showAll(){
  setView('av');setNav('nav-all');q=[...S];qi=0
  renderList(S,'al');closeSb()
}
function showGenre(g){
  const f=S.filter(s=>s.g===g);q=f;qi=0
  document.getElementById('vtl').textContent=g
  document.getElementById('vsb').textContent=`${f.length} canciones · Género`
  renderList(f,'sg');setView('lv');setNav(null);closeSb()
}
function showMood(mk){
  const f=S.filter(s=>s.m.includes(mk));q=f;qi=0
  document.getElementById('vtl').textContent=MOODS[mk]?.l||mk
  document.getElementById('vsb').textContent=`${f.length} canciones · Mood`
  renderList(f,'sg');setView('lv');setNav(null);closeSb()
}
function doSearch(v){
  if(!v.trim()){showHome();return}
  const r=S.filter(s=>s.t.toLowerCase().includes(v.toLowerCase())||
    s.a.toLowerCase().includes(v.toLowerCase())||
    s.g.toLowerCase().includes(v.toLowerCase()))
  q=r;qi=0
  document.getElementById('stl2').textContent=`"${v}"`
  document.getElementById('ssb2').textContent=`${r.length} resultado${r.length!==1?'s':''}`
  renderList(r,'sr2');setView('sv');setNav(null)
}

/* ── MOBILE SIDEBAR ── */
function toggleSb(){
  const s=document.getElementById('sb'),o=document.getElementById('ov')
  const open=s.classList.toggle('open')
  o.classList.toggle('hidden',!open)
}
function closeSb(){
  document.getElementById('sb').classList.remove('open')
  document.getElementById('ov').classList.add('hidden')
}

/* ── INIT ── */
window.onload=()=>{greet();renderSidebar();renderHome();showHome();loadYT()}
