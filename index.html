<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jordy Vibes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0d0d0d;
      --surface:  #161616;
      --border:   rgba(255,255,255,0.07);
      --muted:    rgba(255,255,255,0.35);
      --text:     #f0ede8;
      --accent:   #c9b99a;
      --accent2:  #e8dfd0;
      --sidebar:  240px;
      --player-h: 76px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    /* ── LAYOUT ──────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: 52px 1fr var(--player-h);
      grid-template-columns: var(--sidebar) 1fr;
      grid-template-areas:
        "header header"
        "sidebar main"
        "player player";
      height: 100vh;
    }

    /* ── HEADER ──────────────────────────────────── */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    .logo {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: var(--accent2);
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      height: 32px;
      cursor: text;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      width: 220px;
    }
    .search-bar input::placeholder { color: var(--muted); }
    .search-icon { color: var(--muted); font-size: 12px; }

    .user-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .user-dot {
      width: 7px; height: 7px;
      background: #5cb85c;
      border-radius: 50%;
    }

    /* ── SIDEBAR ─────────────────────────────────── */
    aside {
      grid-area: sidebar;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #111111;
    }

    .nav-section { padding: 20px 16px 8px; }
    .nav-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
      font-size: 13px;
      font-weight: 400;
    }
    .nav-item:hover { background: var(--surface); color: var(--text); }
    .nav-item.active { background: rgba(201,185,154,0.1); color: var(--accent2); }

    .nav-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--muted);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 0; }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .export-btn {
      cursor: pointer;
      transition: color 0.15s;
    }
    .export-btn:hover { color: var(--accent); }

    /* ── MAIN ────────────────────────────────────── */
    main {
      grid-area: main;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── HOME ────────────────────────────────────── */
    .hero {
      padding: 52px 40px 40px;
      border-bottom: 1px solid var(--border);
    }
    .greeting-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .greeting-title {
      font-family: 'Instrument Serif', serif;
      font-size: 46px;
      line-height: 1.05;
      color: var(--accent2);
      margin-bottom: 8px;
    }
    .greeting-sub {
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
    }

    .section { padding: 36px 40px; }
    .section-title {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .genre-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .genre-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 16px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .genre-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .genre-icon {
      font-size: 22px;
      margin-bottom: 12px;
      display: block;
    }
    .genre-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .genre-count { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .mood-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 10px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .mood-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .mood-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .mood-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
    }

    /* ── LIST VIEW ───────────────────────────────── */
    .list-header {
      position: sticky;
      top: 0;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(16px);
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--text); }
    .back-arrow { font-size: 16px; }

    .view-info {}
    .view-title {
      font-family: 'Instrument Serif', serif;
      font-size: 30px;
      color: var(--accent2);
      line-height: 1;
    }
    .view-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }

    .play-all-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 7px;
      padding: 10px 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }
    .play-all-btn:hover { opacity: 0.85; transform: scale(1.02); }

    .songs-list { padding: 16px 40px 24px; }

    .song-row {
      display: grid;
      grid-template-columns: 28px 1fr auto auto;
      align-items: center;
      gap: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .song-row:hover { background: var(--surface); }
    .song-row:hover .song-play-btn { opacity: 1; }
    .song-row:hover .song-num { opacity: 0; }
    .song-row.playing { background: rgba(201,185,154,0.07); }
    .song-row.playing .song-title { color: var(--accent); }

    .song-num { font-size: 12px; color: var(--muted); text-align: center; transition: opacity 0.1s; }
    .song-play-btn {
      position: absolute;
      opacity: 0;
      font-size: 12px;
      color: var(--text);
      transition: opacity 0.1s;
      cursor: pointer;
      background: none;
      border: none;
    }
    .song-num-wrap { position: relative; display: flex; align-items: center; justify-content: center; }

    .song-meta {}
    .song-title { font-size: 13px; font-weight: 400; color: var(--text); }
    .song-artist { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .song-tags { display: flex; gap: 4px; }
    .tag {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .song-genre-badge {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    /* All songs view */
    .all-header {
      padding: 40px 40px 16px;
    }
    .all-title {
      font-family: 'Instrument Serif', serif;
      font-size: 36px;
      color: var(--accent2);
    }
    .all-subtitle { font-size: 13px; color: var(--muted); margin-top: 6px; }

    /* ── PLAYER ──────────────────────────────────── */
    #player-bar {
      grid-area: player;
      background: rgba(20,20,20,0.98);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      align-items: center;
      padding: 0 24px;
      z-index: 200;
      transition: opacity 0.3s;
    }
    #player-bar.idle { opacity: 0.4; pointer-events: none; }

    .player-info { display: flex; align-items: center; gap: 14px; }
    .player-thumb {
      width: 42px; height: 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .player-thumb-icon { font-size: 18px; }
    .player-track-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    .player-track-artist { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .control-btns { display: flex; align-items: center; gap: 22px; }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 4px;
      transition: color 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
    }
    .ctrl-btn:hover { color: var(--text); transform: scale(1.1); }

    .play-main {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--accent2);
      border: none;
      color: #0d0d0d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: transform 0.1s, opacity 0.15s;
    }
    .play-main:hover { transform: scale(1.08); }
    .play-main:active { transform: scale(0.95); }

    .progress-area { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px; }
    .time-label { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 30px; }
    .progress-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s linear;
      pointer-events: none;
    }
    .progress-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent2);
      left: 0%;
      opacity: 0;
      transition: left 0.5s linear, opacity 0.2s;
      pointer-events: none;
    }
    .progress-track:hover .progress-thumb { opacity: 1; }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }
    .volume-area { display: flex; align-items: center; gap: 8px; }
    .vol-icon { font-size: 13px; color: var(--muted); }
    .volume-slider {
      -webkit-appearance: none;
      width: 80px; height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--accent2);
      cursor: pointer;
    }
    .close-player {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color 0.15s;
    }
    .close-player:hover { color: var(--text); }

    /* YT Hidden */
    #yt-player { display: none; }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* ── SVG ICONS ───────────────────────────────── */
    svg { display: inline-block; }

    /* ── EMPTY ───────────────────────────────────── */
    .empty { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── LOADING STATE ───────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

    /* ── PLAYING INDICATOR ───────────────────────── */
    @keyframes bar-pulse {
      0%, 100% { transform: scaleY(0.4); }
      50%       { transform: scaleY(1); }
    }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .bar {
      width: 2px; height: 12px;
      background: var(--accent);
      border-radius: 1px;
      transform-origin: bottom;
      animation: bar-pulse 0.8s ease-in-out infinite;
    }
    .bar:nth-child(2) { animation-delay: 0.15s; }
    .bar:nth-child(3) { animation-delay: 0.3s; }
    .bar.paused { animation-play-state: paused; }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">Jordy Vibes</div>

    <div class="search-bar">
      <svg class="search-icon" width="12" height="12" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input id="search-input" type="text" placeholder="Buscar canciones, artistas..." oninput="handleSearch(this.value)" />
    </div>

    <div class="user-tag">
      <div class="user-dot"></div>
      Jordy Perez &nbsp;·&nbsp; EC
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside>
    <div class="sidebar-scroll">
      <div class="nav-section">
        <div class="nav-item active" id="nav-home" onclick="showHome()">
          <span>Inicio</span>
        </div>
        <div class="nav-item" id="nav-all" onclick="showAllSongs()">
          <span>Todas las canciones</span>
          <span class="nav-badge">100</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Géneros</div>
        <div id="genres-list"></div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Moods</div>
        <div id="moods-list"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <span>100 canciones</span>
      <span class="export-btn" onclick="exportPrompt()">Exportar a Spotify</span>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main-content">

    <!-- HOME -->
    <div id="home-view" class="view active">
      <div class="hero">
        <div class="greeting-label">Tu espacio</div>
        <div class="greeting-title">Buenas noches,<br/>Jordy.</div>
        <div class="greeting-sub">¿Qué mood traes hoy?</div>
      </div>

      <div class="section">
        <div class="section-title">Géneros</div>
        <div class="genre-grid" id="featured-genres"></div>
      </div>

      <div class="section" style="padding-top:0">
        <div class="section-title">Moods</div>
        <div class="mood-grid" id="featured-moods"></div>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div id="list-view" class="view">
      <div class="list-header">
        <div>
          <div class="back-btn" onclick="showHome()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Volver
          </div>
          <div class="view-title" id="view-title" style="margin-top:8px;"></div>
          <div class="view-sub" id="view-sub"></div>
        </div>
        <button class="play-all-btn" onclick="playAll()">
          <svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor">
            <path d="M0 0L10 6L0 12V0Z"/>
          </svg>
          Reproducir todo
        </button>
      </div>
      <div class="songs-list" id="songs-grid"></div>
    </div>

    <!-- ALL SONGS -->
    <div id="all-songs-view" class="view">
      <div class="all-header">
        <div class="all-title">Todas tus canciones</div>
        <div class="all-subtitle">100 canciones · Tu biblioteca personal</div>
      </div>
      <div class="songs-list" id="all-songs-list"></div>
    </div>

    <!-- SEARCH -->
    <div id="search-view" class="view">
      <div class="list-header">
        <div>
          <div class="view-title" id="search-title">Resultados</div>
          <div class="view-sub" id="search-sub"></div>
        </div>
      </div>
      <div class="songs-list" id="search-results"></div>
    </div>

  </main>

  <!-- PLAYER -->
  <div id="player-bar" class="idle">
    <!-- Left: info -->
    <div class="player-info">
      <div class="player-thumb" id="player-thumb">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
          <path d="M6 5.5L11 8L6 10.5V5.5Z" fill="rgba(255,255,255,0.3)"/>
        </svg>
      </div>
      <div>
        <div class="player-track-title" id="player-title">—</div>
        <div class="player-track-artist" id="player-artist">Selecciona una canción</div>
      </div>
    </div>

    <!-- Center: controls -->
    <div class="player-controls">
      <div class="control-btns">
        <button class="ctrl-btn" onclick="prevSong()" title="Anterior">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 3h1.5v10H3zM5.5 8L13 3v10L5.5 8z"/>
          </svg>
        </button>
        <button class="play-main" id="play-btn" onclick="togglePlay()">
          <svg id="play-icon" width="12" height="14" viewBox="0 0 12 14" fill="currentColor">
            <path d="M0 0L12 7L0 14V0Z"/>
          </svg>
        </button>
        <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13 3h-1.5v10H13zM10.5 8L3 3v10l7.5-5z"/>
          </svg>
        </button>
      </div>
      <div class="progress-area">
        <span class="time-label" id="time-cur">0:00</span>
        <div class="progress-track" id="progress-track" onclick="seekTo(event)">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <span class="time-label" style="text-align:right" id="time-dur">—</span>
      </div>
    </div>

    <!-- Right: volume + close -->
    <div class="player-right">
      <div class="volume-area">
        <svg class="vol-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1 5h3l3-3v10l-3-3H1V5zM9.5 4.5a4 4 0 010 5M11.5 2.5a7 7 0 010 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input type="range" class="volume-slider" id="vol-slider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
      </div>
      <button class="close-player" onclick="closePlayer()" title="Cerrar">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let ytPlayer = null
let ytReady  = false
let currentSong = null
let currentQueue = []
let currentQueueIndex = -1
let isPlaying = false
let currentView = 'home'
let currentFilter = null
let currentFilterType = null
let progressInterval = null

// ─────────────────────────────────────────────
// YOUTUBE PLAYER
// ─────────────────────────────────────────────
function loadYTApi() {
  const tag = document.createElement('script')
  tag.src = 'https://www.youtube.com/iframe_api'
  document.body.appendChild(tag)
}

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '0', width: '0',
    playerVars: { autoplay: 0, controls: 0, rel: 0 },
    events: {
      onReady: () => { ytReady = true },
      onStateChange: onYTStateChange,
    }
  })
}

function onYTStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) {
    nextSong()
  }
  if (e.data === YT.PlayerState.PLAYING) {
    isPlaying = true
    updatePlayIcon()
    startProgressTick()
  }
  if (e.data === YT.PlayerState.PAUSED) {
    isPlaying = false
    updatePlayIcon()
    stopProgressTick()
  }
}

function startProgressTick() {
  stopProgressTick()
  progressInterval = setInterval(updateProgress, 500)
}
function stopProgressTick() {
  clearInterval(progressInterval)
}

function updateProgress() {
  if (!ytPlayer || !ytPlayer.getDuration) return
  const dur = ytPlayer.getDuration()
  const cur = ytPlayer.getCurrentTime()
  if (!dur) return
  const pct = (cur / dur) * 100
  document.getElementById('progress-fill').style.width = pct + '%'
  document.getElementById('progress-fill').style.transition = 'width 0.5s linear'
  document.getElementById('progress-thumb').style.left = pct + '%'
  document.getElementById('progress-thumb').style.transition = 'left 0.5s linear'
  document.getElementById('time-cur').textContent = fmtTime(cur)
  document.getElementById('time-dur').textContent = fmtTime(dur)
}

function fmtTime(s) {
  const m = Math.floor(s / 60)
  const sec = Math.floor(s % 60)
  return `${m}:${sec.toString().padStart(2,'0')}`
}

function seekTo(e) {
  if (!ytPlayer || !ytPlayer.getDuration) return
  const track = document.getElementById('progress-track')
  const rect = track.getBoundingClientRect()
  const pct = (e.clientX - rect.left) / rect.width
  ytPlayer.seekTo(ytPlayer.getDuration() * pct, true)
}

function setVolume(val) {
  if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(Number(val))
}

// ─────────────────────────────────────────────
// PLAYBACK
// ─────────────────────────────────────────────
function playSong(songOrId) {
  const song = typeof songOrId === 'number'
    ? songs.find(s => s.id === songOrId)
    : songOrId
  if (!song) return

  currentSong = song

  // Update player UI
  document.getElementById('player-bar').classList.remove('idle')
  document.getElementById('player-title').textContent = song.title
  document.getElementById('player-artist').textContent = song.artist
  document.getElementById('player-thumb').innerHTML =
    `<span style="font-size:15px;color:var(--accent);font-weight:600;font-family:'DM Sans'">${genreIcon[song.genre]||'M'}</span>`

  // Reset progress
  document.getElementById('progress-fill').style.width = '0%'
  document.getElementById('progress-thumb').style.left = '0%'
  document.getElementById('time-cur').textContent = '0:00'
  document.getElementById('time-dur').textContent = '—'

  // Highlight row
  document.querySelectorAll('.song-row').forEach(r => r.classList.remove('playing'))
  const row = document.querySelector(`.song-row[data-id="${song.id}"]`)
  if (row) row.classList.add('playing')

  if (song.ytId && ytReady) {
    ytPlayer.loadVideoById(song.ytId)
    ytPlayer.setVolume(Number(document.getElementById('vol-slider').value))
    isPlaying = true
  } else {
    // No YT id — fake progress for placeholder
    isPlaying = true
    fakeProgress()
    document.getElementById('time-dur').textContent = '3:45'
  }

  updatePlayIcon()
}

function fakeProgress() {
  stopProgressTick()
  let elapsed = 0
  const total = 225
  progressInterval = setInterval(() => {
    if (!isPlaying) return
    elapsed++
    const pct = (elapsed / total) * 100
    document.getElementById('progress-fill').style.width = pct + '%'
    document.getElementById('progress-thumb').style.left = pct + '%'
    document.getElementById('time-cur').textContent = fmtTime(elapsed)
    if (elapsed >= total) { clearInterval(progressInterval); nextSong() }
  }, 1000)
}

function togglePlay() {
  if (!currentSong) return
  if (!ytReady || !currentSong.ytId) {
    isPlaying = !isPlaying
    updatePlayIcon()
    return
  }
  if (isPlaying) { ytPlayer.pauseVideo() }
  else           { ytPlayer.playVideo() }
}

function updatePlayIcon() {
  const icon = document.getElementById('play-icon')
  if (isPlaying) {
    icon.innerHTML = '<rect x="1" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="7.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/>'
    icon.setAttribute('viewBox','0 0 12 14')
  } else {
    icon.innerHTML = '<path d="M0 0L12 7L0 14V0Z"/>'
    icon.setAttribute('viewBox','0 0 12 14')
  }
}

function nextSong() {
  if (currentQueue.length === 0) return
  currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length
  playSong(currentQueue[currentQueueIndex])
}

function prevSong() {
  if (currentQueue.length === 0) return
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length
  playSong(currentQueue[currentQueueIndex])
}

function closePlayer() {
  if (ytReady && ytPlayer.stopVideo) ytPlayer.stopVideo()
  stopProgressTick()
  isPlaying = false
  currentSong = null
  document.getElementById('player-bar').classList.add('idle')
  document.getElementById('player-title').textContent = '—'
  document.getElementById('player-artist').textContent = 'Selecciona una canción'
  document.getElementById('progress-fill').style.width = '0%'
  document.getElementById('time-cur').textContent = '0:00'
  document.getElementById('time-dur').textContent = '—'
  document.querySelectorAll('.song-row').forEach(r => r.classList.remove('playing'))
}

function playAll() {
  if (currentQueue.length === 0) return
  currentQueueIndex = 0
  playSong(currentQueue[0])
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderSidebar() {
  const genres = [...new Set(songs.map(s => s.genre))]
  const gl = document.getElementById('genres-list')
  gl.innerHTML = ''
  genres.forEach(g => {
    const n = songs.filter(s => s.genre === g).length
    gl.innerHTML += `
      <div class="nav-item" onclick="showGenre('${g}')">
        <span>${g}</span>
        <span class="nav-badge">${n}</span>
      </div>`
  })

  const ml = document.getElementById('moods-list')
  ml.innerHTML = ''
  Object.entries(moodMeta).forEach(([key, m]) => {
    const n = songs.filter(s => s.moods.includes(key)).length
    ml.innerHTML += `
      <div class="nav-item" onclick="showMood('${key}')">
        <span>${m.label}</span>
        <span class="nav-badge">${n}</span>
      </div>`
  })
}

function renderHome() {
  const genres = [...new Set(songs.map(s => s.genre))]
  const fg = document.getElementById('featured-genres')
  fg.innerHTML = ''
  genres.slice(0,10).forEach(g => {
    const n = songs.filter(s => s.genre === g).length
    fg.innerHTML += `
      <div class="genre-card" onclick="showGenre('${g}')">
        <span class="genre-icon" style="color:var(--accent);font-size:16px;font-weight:600;font-family:'DM Sans'">${genreIcon[g]||'M'}</span>
        <div class="genre-name">${g}</div>
        <div class="genre-count">${n} canciones</div>
      </div>`
  })

  const fm = document.getElementById('featured-moods')
  fm.innerHTML = ''
  Object.entries(moodMeta).forEach(([key, m]) => {
    fm.innerHTML += `
      <div class="mood-card" onclick="showMood('${key}')">
        <div class="mood-dot" style="background:${m.color}20;color:${m.color}">${m.letter}</div>
        <div class="mood-label">${m.label}</div>
      </div>`
  })
}

function renderSongList(list, containerId) {
  const container = document.getElementById(containerId)
  container.innerHTML = ''
  if (!list.length) {
    container.innerHTML = '<div class="empty">Sin canciones en esta categoría.</div>'
    return
  }
  list.forEach((song, i) => {
    const hasPb = song.ytId ? '' : 'style="opacity:0.45" title="Sin audio disponible"'
    const row = document.createElement('div')
    row.className = 'song-row'
    row.dataset.id = song.id
    row.innerHTML = `
      <div class="song-num-wrap">
        <span class="song-num">${i+1}</span>
        <button class="song-play-btn" onclick="event.stopPropagation();queueAndPlay(${song.id})"
          ${hasPb}>&#9654;</button>
      </div>
      <div class="song-meta">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="song-tags">
        ${song.moods.map(m => `<span class="tag">${moodMeta[m]?.label||m}</span>`).join('')}
      </div>
      <div class="song-genre-badge">${song.genre}</div>
    `
    row.addEventListener('click', () => queueAndPlay(song.id))
    container.appendChild(row)
  })
}

function queueAndPlay(id) {
  const idx = currentQueue.findIndex(s => s.id === id)
  if (idx !== -1) currentQueueIndex = idx
  playSong(id)
}

// ─────────────────────────────────────────────
// VIEWS
// ─────────────────────────────────────────────
function setActiveView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  document.getElementById('main-content').scrollTop = 0
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  if (id) document.getElementById(id)?.classList.add('active')
}

function showHome() {
  setActiveView('home-view')
  setActiveNav('nav-home')
  currentView = 'home'
  currentQueue = songs
  document.getElementById('search-input').value = ''
}

function showAllSongs() {
  setActiveView('all-songs-view')
  setActiveNav('nav-all')
  currentView = 'all'
  currentQueue = [...songs]
  currentQueueIndex = 0
  renderSongList(songs, 'all-songs-list')
}

function showGenre(g) {
  const filtered = songs.filter(s => s.genre === g)
  currentQueue = filtered
  currentQueueIndex = 0
  currentFilter = g; currentFilterType = 'genre'
  document.getElementById('view-title').textContent = g
  document.getElementById('view-sub').textContent = `${filtered.length} canciones · Género`
  renderSongList(filtered, 'songs-grid')
  setActiveView('list-view')
  setActiveNav(null)
  currentView = 'genre'
}

function showMood(m) {
  const filtered = songs.filter(s => s.moods.includes(m))
  currentQueue = filtered
  currentQueueIndex = 0
  currentFilter = m; currentFilterType = 'mood'
  document.getElementById('view-title').textContent = moodMeta[m]?.label || m
  document.getElementById('view-sub').textContent = `${filtered.length} canciones · Mood`
  renderSongList(filtered, 'songs-grid')
  setActiveView('list-view')
  setActiveNav(null)
  currentView = 'mood'
}

function handleSearch(q) {
  if (!q.trim()) { showHome(); return }
  const results = songs.filter(s =>
    s.title.toLowerCase().includes(q.toLowerCase()) ||
    s.artist.toLowerCase().includes(q.toLowerCase()) ||
    s.genre.toLowerCase().includes(q.toLowerCase())
  )
  currentQueue = results
  currentQueueIndex = 0
  document.getElementById('search-title').textContent = `"${q}"`
  document.getElementById('search-sub').textContent = `${results.length} resultado${results.length!==1?'s':''}`
  renderSongList(results, 'search-results')
  setActiveView('search-view')
  setActiveNav(null)
}

function exportPrompt() {
  alert('En una versión real, esto exportaría tu playlist a Spotify.\n\nFuncionalidad de demo.')
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  renderSidebar()
  renderHome()
  showHome()
  loadYTApi()
}

window.onload = init
</script>
</body>
</html>
