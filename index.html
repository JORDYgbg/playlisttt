<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Jordy Vibes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #080808;
  --bg2: #0f0f0f;
  --surf: #151515;
  --surf2: #1c1c1c;
  --surf3: #242424;
  --border: rgba(255,255,255,.06);
  --border2: rgba(255,255,255,.11);
  --muted: rgba(255,255,255,.32);
  --muted2: rgba(255,255,255,.55);
  --text: #ede9e3;
  --gold: #c9aa72;
  --gold2: #e8d5aa;
  --gold3: #f5ead0;
  --sw: 230px;
  --ph: 88px;
  --hh: 56px;
  --r: 10px;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans: 'Outfit', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ── LAYOUT ── */
.app {
  display: grid;
  grid-template-rows: var(--hh) 1fr var(--ph);
  grid-template-columns: var(--sw) 1fr;
  grid-template-areas: "hd hd" "sb mn" "pl pl";
  height: 100dvh;
  height: 100vh;
}

/* ── HEADER ── */
header {
  grid-area: hd;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(8,8,8,.97);
  backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.logo {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 400;
  color: var(--gold2);
  letter-spacing: .03em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-dot { width: 5px; height: 5px; background: var(--gold); border-radius: 50%; }

.hcenter { flex: 1; display: flex; justify-content: center; }

.sbar {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surf);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 0 14px;
  height: 34px;
  width: min(280px, 100%);
  transition: border-color .2s, box-shadow .2s;
}
.sbar:focus-within {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,170,114,.08);
}
.sbar input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 300;
  width: 100%;
}
.sbar input::placeholder { color: var(--muted); }

.hright { display: flex; align-items: center; gap: 12px; }

.upill {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted2);
  font-weight: 300;
  letter-spacing: .02em;
}
.status-dot { width: 6px; height: 6px; background: #5cba6a; border-radius: 50%; box-shadow: 0 0 6px rgba(92,186,106,.5); }

.mbtn {
  display: none;
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  padding: 7px;
  border-radius: 7px;
  transition: background .15s, color .15s;
  align-items: center;
}
.mbtn:hover { background: var(--surf); color: var(--text); }

/* ── SIDEBAR ── */
aside {
  grid-area: sb;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}

.ss { flex: 1; overflow-y: auto; padding-bottom: 16px; }
.ss::-webkit-scrollbar { width: 0; }

.ns { padding: 18px 14px 4px; }
.nsl {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 9px;
  margin-bottom: 6px;
  font-weight: 500;
}

.ni {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  color: var(--muted2);
  font-size: 13px;
  font-weight: 300;
  transition: background .12s, color .12s, padding-left .15s;
  user-select: none;
}
.ni:hover { background: var(--surf); color: var(--text); padding-left: 14px; }
.ni.act { background: rgba(201,170,114,.1); color: var(--gold2); padding-left: 14px; }

.ni-icon { font-size: 11px; margin-right: 6px; opacity: .6; }

.bdg {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--surf2);
  color: var(--muted);
  font-weight: 400;
}
.ni.act .bdg { background: rgba(201,170,114,.15); color: var(--gold); }

.sfoot {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.expbtn {
  cursor: pointer;
  color: var(--muted2);
  transition: color .15s;
  font-size: 11px;
}
.expbtn:hover { color: var(--gold); }

/* ── OVERLAY ── */
.ov {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 299;
  backdrop-filter: blur(4px);
  transition: opacity .25s;
}
.ov.show { display: block; }

/* ── MAIN ── */
main {
  grid-area: mn;
  overflow-y: auto;
  scroll-behavior: smooth;
  background: var(--bg);
}
main::-webkit-scrollbar { width: 4px; }
main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px; }

/* ── VIEWS ── */
.view { display: none; }
.view.act { display: block; }

/* ── HOME ── */
.hero {
  padding: 52px 40px 44px;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,170,114,.06) 0%, transparent 70%);
  pointer-events: none;
}
.hlbl {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
  font-weight: 500;
}
.htitle {
  font-family: var(--font-serif);
  font-size: 52px;
  font-weight: 300;
  line-height: 1.05;
  color: var(--gold3);
  letter-spacing: .01em;
}
.hsub {
  font-size: 14px;
  color: var(--muted2);
  margin-top: 10px;
  font-weight: 300;
  letter-spacing: .01em;
}

.sec { padding: 32px 40px; }
.sec + .sec { padding-top: 0; }
.seclbl {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
  font-weight: 500;
}

/* Genre grid */
.ggrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.gc {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 14px;
  cursor: pointer;
  transition: border-color .2s, transform .2s, background .2s;
  position: relative;
  overflow: hidden;
}
.gc::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .25s;
}
.gc:hover { border-color: var(--gold); transform: translateY(-4px); background: var(--surf2); }
.gc:hover::before { opacity: 1; }
.gltr {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  font-family: var(--font-sans);
}
.gname { font-size: 12px; font-weight: 500; color: var(--text); letter-spacing: .01em; }
.gcnt { font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 300; }

/* Mood grid */
.mgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}
.mc {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 8px;
  cursor: pointer;
  text-align: center;
  transition: border-color .2s, transform .2s, background .2s;
}
.mc:hover { border-color: var(--gold); transform: translateY(-4px); background: var(--surf2); }
.mdot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  margin: 0 auto 9px;
}
.mlbl { font-size: 11px; color: var(--muted2); font-weight: 300; }

/* ── LIST VIEW ── */
.lhd {
  position: sticky;
  top: 0;
  background: rgba(8,8,8,.97);
  backdrop-filter: blur(24px);
  padding: 22px 40px;
  border-bottom: 1px solid var(--border);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.bbtn {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  color: var(--muted);
  font-size: 12px;
  transition: color .15s;
  background: none;
  border: none;
  font-family: var(--font-sans);
  font-weight: 300;
  letter-spacing: .02em;
}
.bbtn:hover { color: var(--gold); }
.vtitle {
  font-family: var(--font-serif);
  font-size: 34px;
  font-weight: 400;
  color: var(--gold2);
  line-height: 1;
  margin-top: 8px;
  letter-spacing: .01em;
}
.vsub { font-size: 11px; color: var(--muted); margin-top: 5px; font-weight: 300; letter-spacing: .02em; }

.pabtn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--gold);
  color: #070707;
  border: none;
  border-radius: 8px;
  padding: 11px 22px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity .15s, transform .15s, box-shadow .15s;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(201,170,114,.25);
}
.pabtn:hover { opacity: .9; transform: scale(1.02); box-shadow: 0 6px 28px rgba(201,170,114,.35); }
.pabtn:active { transform: scale(.97); }

/* ── SONG LIST ── */
.swrp { padding: 12px 40px 32px; }

.sr {
  display: grid;
  grid-template-columns: 32px 38px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s;
  position: relative;
}
.sr:hover { background: var(--surf); }
.sr.on { background: rgba(201,170,114,.07); }
.sr.on .stl { color: var(--gold); }
.sr:hover .sn { visibility: hidden; }
.sr:hover .spb { visibility: visible; }

/* Number cell */
.nc { position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sn { font-size: 12px; color: var(--muted); position: absolute; font-variant-numeric: tabular-nums; }
.spb {
  position: absolute;
  visibility: hidden;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

/* Cover */
.scover {
  width: 38px;
  height: 38px;
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--surf2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
  font-family: var(--font-sans);
  border: 1px solid var(--border);
}
.scover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
.scover img.loaded { display: block; }
.scover.has-img { background: transparent; }

.stl { font-size: 13px; color: var(--text); font-weight: 400; letter-spacing: .01em; }
.sat { font-size: 11px; color: var(--muted2); margin-top: 3px; font-weight: 300; }

.stgs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.stg {
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--muted);
  font-weight: 300;
  letter-spacing: .04em;
  white-space: nowrap;
}

.allhd { padding: 40px 40px 16px; }
.alltl { font-family: var(--font-serif); font-size: 40px; font-weight: 400; color: var(--gold2); letter-spacing: .01em; }
.allsb { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 300; letter-spacing: .02em; }

.empty { padding: 60px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 300; }

/* ── PLAYER ── */
#pbar {
  grid-area: pl;
  background: rgba(10,10,10,.98);
  backdrop-filter: blur(36px);
  border-top: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 16px;
  z-index: 200;
  transition: opacity .3s;
}
#pbar.idle { opacity: .25; pointer-events: none; }

/* Player info */
.pi { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }

.pcover {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  background: var(--surf);
  border: 1px solid var(--border2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--gold);
  font-family: var(--font-sans);
  overflow: hidden;
  transition: box-shadow .3s;
}
#pbar:not(.idle) .pcover { box-shadow: 0 4px 20px rgba(201,170,114,.2); }
.pcover img { width: 100%; height: 100%; object-fit: cover; display: none; }
.pcover img.loaded { display: block; }
.pcover.has-img { background: transparent; }

.pmeta { min-width: 0; }
.ptl {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  letter-tracking: .01em;
}
.pat {
  font-size: 11px;
  color: var(--muted2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  margin-top: 3px;
  font-weight: 300;
}

/* Player controls */
.pc { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
.crow { display: flex; align-items: center; gap: 18px; }

.cbtn {
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  border-radius: 7px;
  transition: color .15s, background .15s, transform .12s;
}
.cbtn:hover { color: var(--text); background: var(--surf); transform: scale(1.1); }
.cbtn:active { transform: scale(.92); }

.pmain {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--gold2);
  border: none;
  color: #080808;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s, opacity .15s, box-shadow .2s;
  box-shadow: 0 4px 16px rgba(201,170,114,.3);
}
.pmain:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(201,170,114,.45); }
.pmain:active { transform: scale(.93); opacity: .85; }

/* Progress */
.prow { display: flex; align-items: center; gap: 10px; width: min(460px, 100%); }
.ptm { font-size: 10px; color: var(--muted); min-width: 32px; font-variant-numeric: tabular-nums; flex-shrink: 0; font-weight: 300; }

.ptr {
  flex: 1;
  height: 3px;
  background: rgba(255,255,255,.1);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
  padding: 8px 0;
  margin: -8px 0;
}
.ptr-inner { width: 100%; height: 3px; border-radius: 2px; position: relative; overflow: visible; }
.ptr:hover .pthm { opacity: 1; }
.pfill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 2px; width: 0%; pointer-events: none; transition: width .1s linear; }
.pthm {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold3);
  left: 0%;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}

/* Player right */
.pr { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: flex-end; }
.vwp { display: flex; align-items: center; gap: 9px; }
.vsl {
  -webkit-appearance: none;
  width: 76px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,.1);
  outline: none;
  cursor: pointer;
}
.vsl::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold2);
  cursor: pointer;
}

.shuf-btn, .rep-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  transition: color .15s, background .15s;
}
.shuf-btn:hover, .rep-btn:hover { color: var(--text); background: var(--surf); }
.shuf-btn.on, .rep-btn.on { color: var(--gold); }

.cplb {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  transition: color .15s, background .15s;
}
.cplb:hover { color: var(--text); background: var(--surf); }

/* ── MOBILE ── */
@media (max-width: 700px) {
  :root { --ph: 96px; --hh: 52px; --sw: 0px; }

  .app {
    grid-template-rows: var(--hh) 1fr var(--ph);
    grid-template-columns: 1fr;
    grid-template-areas: "hd" "mn" "pl";
  }

  aside {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 270px;
    z-index: 300;
    transform: translateX(-100%);
  }
  aside.open { transform: translateX(0); }

  .mbtn { display: flex; }
  .hcenter { display: none; }
  .upill .upname { display: none; }

  /* Hero */
  .hero { padding: 32px 22px 28px; }
  .htitle { font-size: 36px; }
  .sec { padding: 22px; }
  .sec + .sec { padding-top: 0; }
  .ggrid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .mgrid { grid-template-columns: repeat(3, 1fr); gap: 7px; }

  /* List */
  .lhd { padding: 16px 20px; }
  .swrp { padding: 10px 14px 24px; }
  .sr { grid-template-columns: 28px 36px 1fr; gap: 10px; }
  .stgs { display: none; }
  .allhd { padding: 28px 22px 12px; }
  .alltl { font-size: 30px; }

  /* Player mobile */
  #pbar {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 6px 12px;
    padding: 10px 18px 14px;
    align-items: center;
  }
  .pi { grid-column: 1; grid-row: 1; align-self: center; }
  .crow { grid-column: 2; grid-row: 1; align-self: center; gap: 14px; }
  .prow { grid-column: 1 / -1; grid-row: 2; width: 100%; max-width: 100%; }
  .pc { display: contents; }
  .pr { display: none; }
  .ptl, .pat { max-width: calc(100vw - 170px); }
  .pmain { width: 38px; height: 38px; }
}

/* ── ANIMATIONS ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.sr { animation: fadeIn .2s ease both; }

/* Playing animation */
.playing-bars {
  display: none;
  gap: 2px;
  align-items: flex-end;
  height: 12px;
}
.sr.on .playing-bars { display: flex; }
.sr.on .sn { display: none; }

.bar {
  width: 2px;
  background: var(--gold);
  border-radius: 1px;
  animation: barAnim 0.8s ease-in-out infinite alternate;
}
.bar:nth-child(1) { height: 40%; animation-delay: 0s; }
.bar:nth-child(2) { height: 80%; animation-delay: .15s; }
.bar:nth-child(3) { height: 60%; animation-delay: .3s; }
.bar:nth-child(4) { height: 100%; animation-delay: .1s; }

@keyframes barAnim {
  from { transform: scaleY(.3); }
  to { transform: scaleY(1); }
}

#ytwrp { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; overflow: hidden; pointer-events: none; opacity: 0; z-index: -1; }

/* Divider lines */
.hdivider { height: 1px; background: var(--border); margin: 0 14px; }
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="mbtn" onclick="toggleSb()" aria-label="Menú">
      <svg width="18" height="13" viewBox="0 0 18 13" fill="none">
        <rect width="18" height="1.8" rx="0.9" fill="currentColor"/>
        <rect y="5.6" width="12" height="1.8" rx="0.9" fill="currentColor"/>
        <rect y="11.2" width="18" height="1.8" rx="0.9" fill="currentColor"/>
      </svg>
    </button>
    <div class="logo">
      <div class="logo-dot"></div>
      Jordy Vibes
    </div>
  </div>
  <div class="hcenter">
    <div class="sbar">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="rgba(255,255,255,.3)" stroke-width="1.4"/>
        <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="rgba(255,255,255,.3)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input type="text" id="sinput" placeholder="Buscar canciones, artistas, géneros…" oninput="doSearch(this.value)"/>
    </div>
  </div>
  <div class="hright">
    <div class="upill">
      <div class="status-dot"></div>
      <span class="upname">Lesly · EC</span>
    </div>
  </div>
</header>

<!-- OVERLAY -->
<div class="ov" id="ov" onclick="closeSb()"></div>

<!-- SIDEBAR -->
<aside id="sb">
  <div class="ss">
    <div class="ns">
      <div class="ni act" id="nav-home" onclick="showHome()">
        <span><span class="ni-icon">✦</span>Inicio</span>
      </div>
      <div class="ni" id="nav-all" onclick="showAll()">
        <span><span class="ni-icon">♫</span>Todas las canciones</span>
        <span class="bdg">100</span>
      </div>
    </div>
    <div class="hdivider"></div>
    <div class="ns"><div class="nsl">Géneros</div><div id="glist"></div></div>
    <div class="hdivider"></div>
    <div class="ns"><div class="nsl">Moods</div><div id="mlist"></div></div>
  </div>
  <div class="sfoot">
    <span style="font-weight:300">100 canciones</span>
    <span class="expbtn" onclick="alert('Demo: exportar playlist a Spotify')">Exportar →</span>
  </div>
</aside>

<!-- MAIN -->
<main id="main">

  <!-- HOME -->
  <div id="hv" class="view act">
    <div class="hero">
      <div class="hlbl">Tu espacio · Biblioteca personal</div>
      <div class="htitle" id="gtitle">Buenas noches,<br/>Lesly.</div>
      <div class="hsub" id="gsub">¿Qué mood traes hoy?</div>
    </div>
    <div class="sec">
      <div class="seclbl">Géneros</div>
      <div class="ggrid" id="fg"></div>
    </div>
    <div class="sec">
      <div class="seclbl">Moods</div>
      <div class="mgrid" id="fm"></div>
    </div>
  </div>

  <!-- LIST -->
  <div id="lv" class="view">
    <div class="lhd">
      <div>
        <button class="bbtn" onclick="showHome()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8 1.5L3.5 6L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Volver
        </button>
        <div class="vtitle" id="vtl"></div>
        <div class="vsub" id="vsb"></div>
      </div>
      <button class="pabtn" onclick="playAll()">
        <svg width="9" height="11" viewBox="0 0 9 11" fill="currentColor"><path d="M0 0L9 5.5L0 11V0Z"/></svg>
        Reproducir todo
      </button>
    </div>
    <div class="swrp" id="sg"></div>
  </div>

  <!-- ALL -->
  <div id="av" class="view">
    <div class="allhd">
      <div class="alltl">Todas las canciones</div>
      <div class="allsb">100 canciones · Tu biblioteca personal</div>
    </div>
    <div class="swrp" id="al"></div>
  </div>

  <!-- SEARCH -->
  <div id="sv" class="view">
    <div class="lhd">
      <div>
        <button class="bbtn" onclick="showHome()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8 1.5L3.5 6L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Volver
        </button>
        <div class="vtitle" id="stl2">Resultados</div>
        <div class="vsub" id="ssb2"></div>
      </div>
    </div>
    <div class="swrp" id="sr2"></div>
  </div>

</main>

<!-- PLAYER -->
<div id="pbar" class="idle">
  <div class="pi">
    <div class="pcover" id="pcover">
      <img id="pcoverImg" alt=""/>
      <span id="pcoverLtr">—</span>
    </div>
    <div class="pmeta">
      <div class="ptl" id="ptl">—</div>
      <div class="pat" id="pat">Selecciona una canción</div>
    </div>
  </div>

  <div class="pc">
    <div class="crow">
      <button class="shuf-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aleatorio">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M11 3h3v3M11 13h3v-3M2 3.5l4 4-4 4M14 3l-4 4M14 13l-4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="cbtn" onclick="prevS()" title="Anterior">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3 3h1.5v10H3zM5.5 8L13 3v10L5.5 8z"/>
        </svg>
      </button>
      <button class="pmain" id="pmain" onclick="togglePlay()">
        <svg id="picon" width="12" height="14" viewBox="0 0 12 14" fill="currentColor">
          <path d="M0 0L12 7L0 14V0Z"/>
        </svg>
      </button>
      <button class="cbtn" onclick="nextS()" title="Siguiente">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M13 3h-1.5v10H13zM10.5 8L3 3v10L10.5 8z"/>
        </svg>
      </button>
      <button class="rep-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repetir">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 5h10M3 11h10M11 3l2 2-2 2M5 9l-2 2 2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="prow">
      <span class="ptm" id="tcur">0:00</span>
      <div class="ptr" id="ptr" onclick="seekTo(event)">
        <div class="ptr-inner">
          <div class="pfill" id="pfill"></div>
          <div class="pthm" id="pthm"></div>
        </div>
      </div>
      <span class="ptm" style="text-align:right" id="tdur">—</span>
    </div>
  </div>

  <div class="pr">
    <div class="vwp">
      <svg width="14" height="13" viewBox="0 0 14 13" fill="none">
        <path d="M1 4.5h2.5L6.5 2v9L3.5 8.5H1V4.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 3.5a4.5 4.5 0 010 6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M11 1.5a7 7 0 010 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
      </svg>
      <input type="range" class="vsl" id="vsl" min="0" max="100" value="80" oninput="setVol(this.value)"/>
    </div>
    <button class="cplb" onclick="closeP()" title="Cerrar">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
        <path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

</div><!-- .app -->

<div id="ytwrp"><div id="ytpl"></div></div>

  {id:98, t:"TEST DRIVE",                a:"Joji",                           g:"R&B",        m:["chill","nocturnas"],            y:"PEBS2jbZce4"},
  {id:99, t:"Tick Tock",                 a:"Joji",                           g:"R&B",        m:["chill","tristes"],              y:"2FCo7OxVoeY"},
  {id:100,t:"Only One",                  a:"Kanye West",                     g:"Hip-Hop",    m:["chill","romanticas"],           y:"3pEQTFxTe0Q"},
]

const MOODS = {
  feliz:      { l:"Feliz",      c:"#d4a843", e:"☀" },
  chill:      { l:"Chill",      c:"#4a9bb8", e:"◌" },
  nocturnas:  { l:"Nocturnas",  c:"#7060b0", e:"☽" },
  tristes:    { l:"Tristes",    c:"#7878a0", e:"✦" },
  energicas:  { l:"Enérgicas",  c:"#c84530", e:"⚡" },
  romanticas: { l:"Románticas", c:"#b86070", e:"♡" },
  dance:      { l:"Dance",      c:"#40b870", e:"♪" },
}

const GC = {
  "Hip-Hop":   "#c8884a",
  "R&B":       "#b85568",
  "Rock":      "#5878c0",
  "Pop":       "#8888c0",
  "Latin":     "#6ab878",
  "Electronic":"#4898c0",
  "Funk":      "#c0a038",
  "Disco":     "#b068a8",
  "New Wave":  "#50a0b0",
  "Classic":   "#a08060",
}

const genres = [...new Set(S.map(s => s.g))]

/* ── STATE ── */
let yt = null, ytOk = false
let cur = null, q = [], qi = -1
let playing = false, shuffleOn = false, repeatOn = false
let tickId = null, fakeId = null

/* ── GREETING ── */
function greet() {
  const h = new Date().getHours()
  let title, sub
  if (h >= 5 && h < 12)       { title = "Buenos días";   sub = "Arranca el día con buena vibra." }
  else if (h >= 12 && h < 19) { title = "Buenas tardes"; sub = "¿Qué mood traes esta tarde?" }
  else                         { title = "Buenas noches"; sub = "La noche es tuya, Lesly." }
  document.getElementById('gtitle').innerHTML = `${title},<br/>Lesly.`
  document.getElementById('gsub').textContent = sub
}

/* ── YOUTUBE ── */
function loadYT() {
  const sc = document.createElement('script')
  sc.src = 'https://www.youtube.com/iframe_api'
  document.body.appendChild(sc)
}
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('ytpl', {
    height: '1', width: '1',
    playerVars: { autoplay: 0, controls: 0, rel: 0, playsinline: 1, disablekb: 1 },
    events: { onReady: () => { ytOk = true; setVol(document.getElementById('vsl').value) }, onStateChange: onSC }
  })
}
function onSC(e) {
  if (e.data === YT.PlayerState.ENDED) {
    if (repeatOn) { yt.seekTo(0); yt.playVideo(); return }
    nextS(); return
  }
  if (e.data === YT.PlayerState.PLAYING) { playing = true; updIcon(); startTick() }
  if (e.data === YT.PlayerState.PAUSED)  { playing = false; updIcon(); stopTick() }
}

/* ── PROGRESS ── */
function startTick() { stopTick(); tickId = setInterval(tick, 250) }
function stopTick()  { clearInterval(tickId) }
function tick() {
  if (!yt || !yt.getDuration) return
  const d = yt.getDuration() || 0, c = yt.getCurrentTime() || 0
  if (!d) return
  setP((c / d) * 100, c, d)
}
function setP(pct, c, d) {
  const p = Math.max(0, Math.min(100, pct))
  document.getElementById('pfill').style.width = p + '%'
  document.getElementById('pthm').style.left = p + '%'
  document.getElementById('tcur').textContent = fmt(c)
  document.getElementById('tdur').textContent = fmt(d)
}
function fmt(s) { const m = Math.floor(s / 60), sc = Math.floor(s % 60); return `${m}:${sc.toString().padStart(2,'0')}` }
function seekTo(e) {
  if (!yt || !yt.getDuration) return
  const r = document.getElementById('ptr').getBoundingClientRect()
  const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
  yt.seekTo(yt.getDuration() * pct, true)
}
function setVol(v) { if (yt && yt.setVolume) yt.setVolume(+v) }

/* ── ALBUM ART via YouTube thumbnail ── */
function getThumb(yid) {
  return yid ? `https://img.youtube.com/vi/${yid}/mqdefault.jpg` : null
}

function setPlayerCover(song) {
  const cover = document.getElementById('pcover')
  const img = document.getElementById('pcoverImg')
  const ltr = document.getElementById('pcoverLtr')
  const thumb = getThumb(song.y)
  if (thumb) {
    cover.classList.add('has-img')
    img.classList.remove('loaded')
    img.src = thumb
    img.onload = () => img.classList.add('loaded')
    ltr.style.display = 'none'
  } else {
    cover.classList.remove('has-img')
    img.src = ''
    ltr.textContent = song.g[0]
    ltr.style.display = ''
  }
}

/* ── PLAYBACK ── */
function playSong(idOrSong) {
  const song = typeof idOrSong === 'number' ? S.find(s => s.id === idOrSong) : idOrSong
  if (!song) return
  cur = song
  document.getElementById('pbar').classList.remove('idle')
  setPlayerCover(song)
  document.getElementById('ptl').textContent = song.t
  document.getElementById('pat').textContent = song.a
  setP(0, 0, 0)
  document.getElementById('tdur').textContent = '—'

  // Update active row
  document.querySelectorAll('.sr').forEach(r => r.classList.remove('on'))
  document.querySelector(`.sr[data-id="${song.id}"]`)?.classList.add('on')

  if (song.y && ytOk) {
    clearInterval(fakeId); stopTick()
    yt.loadVideoById(song.y)
    setVol(document.getElementById('vsl').value)
    playing = true
  } else {
    playing = true
    runFake(210)
  }
  updIcon()
}

function runFake(tot) {
  stopTick(); clearInterval(fakeId); let e = 0
  document.getElementById('tdur').textContent = fmt(tot)
  fakeId = setInterval(() => {
    if (!playing) return
    e++; setP((e / tot) * 100, e, tot)
    if (e >= tot) { clearInterval(fakeId); nextS() }
  }, 1000)
}

function togglePlay() {
  if (!cur) return
  if (cur.y && ytOk) { playing ? yt.pauseVideo() : yt.playVideo() }
  else { playing = !playing; updIcon() }
}

function updIcon() {
  const ic = document.getElementById('picon')
  if (playing) {
    ic.setAttribute('viewBox', '0 0 12 14')
    ic.innerHTML = '<rect x="0" y="0" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="8" y="0" width="4" height="14" rx="1.5" fill="currentColor"/>'
  } else {
    ic.setAttribute('viewBox', '0 0 12 14')
    ic.innerHTML = '<path d="M0 0L12 7L0 14V0Z"/>'
  }
  // Update playing bars in song list
  document.querySelectorAll('.playing-bars').forEach(b => {
    b.style.animationPlayState = playing ? 'running' : 'paused'
  })
}

function nextS() {
  if (!q.length) return
  if (shuffleOn) qi = Math.floor(Math.random() * q.length)
  else qi = (qi + 1) % q.length
  playSong(q[qi])
}

function prevS() {
  if (!q.length) return
  if (yt && ytOk && yt.getCurrentTime && yt.getCurrentTime() > 3) {
    yt.seekTo(0, true); return
  }
  qi = (qi - 1 + q.length) % q.length
  playSong(q[qi])
}

function closeP() {
  if (ytOk && yt.stopVideo) yt.stopVideo()
  stopTick(); clearInterval(fakeId); playing = false; cur = null
  document.getElementById('pbar').classList.add('idle')
  document.getElementById('ptl').textContent = '—'
  document.getElementById('pat').textContent = 'Selecciona una canción'
  const cover = document.getElementById('pcover')
  cover.classList.remove('has-img')
  document.getElementById('pcoverImg').src = ''
  document.getElementById('pcoverLtr').textContent = '—'
  document.getElementById('pcoverLtr').style.display = ''
  setP(0, 0, 0)
  document.getElementById('tdur').textContent = '—'
  document.querySelectorAll('.sr').forEach(r => r.classList.remove('on'))
  updIcon()
}

function playAll() { if (q.length) { qi = 0; playSong(q[0]) } }

function qplay(id) {
  const idx = q.findIndex(s => s.id === id)
  if (idx !== -1) qi = idx
  else { q = [...S]; qi = S.findIndex(s => s.id === id) }
  playSong(id)
  closeSb()
}

function toggleShuffle() {
  shuffleOn = !shuffleOn
  document.getElementById('shuffleBtn').classList.toggle('on', shuffleOn)
}
function toggleRepeat() {
  repeatOn = !repeatOn
  document.getElementById('repeatBtn').classList.toggle('on', repeatOn)
}

/* ── RENDER ── */
function renderSidebar() {
  const gl = document.getElementById('glist'); gl.innerHTML = ''
  genres.forEach(g => {
    const n = S.filter(s => s.g === g).length
    const d = document.createElement('div'); d.className = 'ni'
    d.innerHTML = `<span>${g}</span><span class="bdg">${n}</span>`
    d.onclick = () => showGenre(g)
    gl.appendChild(d)
  })
  const ml = document.getElementById('mlist'); ml.innerHTML = ''
  Object.entries(MOODS).forEach(([k, mo]) => {
    const n = S.filter(s => s.m.includes(k)).length
    const d = document.createElement('div'); d.className = 'ni'
    d.innerHTML = `<span>${mo.e} ${mo.l}</span><span class="bdg">${n}</span>`
    d.onclick = () => showMood(k)
    ml.appendChild(d)
  })
}

function renderHome() {
  const fg = document.getElementById('fg'); fg.innerHTML = ''
  genres.forEach(g => {
    const n = S.filter(s => s.g === g).length, c = GC[g] || '#a09080'
    fg.innerHTML += `<div class="gc" onclick="showGenre('${g.replace(/'/g,"\\'")}')">
      <div class="gltr" style="background:${c}18;color:${c}">${g[0]}</div>
      <div class="gname">${g}</div>
      <div class="gcnt">${n} canciones</div>
    </div>`
  })
  const fm = document.getElementById('fm'); fm.innerHTML = ''
  Object.entries(MOODS).forEach(([k, mo]) => {
    fm.innerHTML += `<div class="mc" onclick="showMood('${k}')">
      <div class="mdot" style="background:${mo.c}20;color:${mo.c};font-size:16px">${mo.e}</div>
      <div class="mlbl">${mo.l}</div>
    </div>`
  })
}

function renderList(list, cid) {
  const c = document.getElementById(cid); c.innerHTML = ''
  if (!list.length) { c.innerHTML = '<div class="empty">Sin canciones en esta selección.</div>'; return }
  list.forEach((song, i) => {
    const row = document.createElement('div')
    row.className = 'sr'
    row.dataset.id = song.id
    if (cur && cur.id === song.id) row.classList.add('on')
    row.style.animationDelay = Math.min(i * 0.03, 0.5) + 's'

    const thumb = getThumb(song.y)
    const coverHtml = thumb
      ? `<div class="scover has-img"><img src="${thumb}" alt="" loading="lazy" onload="this.classList.add('loaded')"/></div>`
      : `<div class="scover" style="color:${GC[song.g]||'var(--gold)'}">${song.g[0]}</div>`

    row.innerHTML = `
      <div class="nc">
        <div class="playing-bars" style="display:${cur&&cur.id===song.id?'flex':'none'}">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span class="sn" style="${cur&&cur.id===song.id?'display:none':''}">${i+1}</span>
        <button class="spb" onclick="event.stopPropagation();qplay(${song.id})">
          <svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor"><path d="M0 0L10 6L0 12V0Z"/></svg>
        </button>
      </div>
      ${coverHtml}
      <div>
        <div class="stl">${song.t}</div>
        <div class="sat">${song.a}</div>
      </div>
      <div class="stgs">${song.m.map(mk => `<span class="stg" style="color:${MOODS[mk]?.c||''};">${MOODS[mk]?.l || mk}</span>`).join('')}</div>`
    row.addEventListener('click', () => qplay(song.id))
    c.appendChild(row)
  })
}

/* ── VIEWS ── */
function setView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('act'))
  document.getElementById(id).classList.add('act')
  document.getElementById('main').scrollTop = 0
}
function setNav(id) {
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('act'))
  if (id) document.getElementById(id)?.classList.add('act')
}

function showHome() {
  setView('hv'); setNav('nav-home'); q = [...S]; qi = cur ? S.findIndex(s => s.id === cur.id) : 0
  document.getElementById('sinput').value = ''
  closeSb()
}
function showAll() {
  setView('av'); setNav('nav-all'); q = [...S]; qi = 0
  renderList(S, 'al'); closeSb()
}
function showGenre(g) {
  const f = S.filter(s => s.g === g); q = f; qi = 0
  document.getElementById('vtl').textContent = g
  document.getElementById('vsb').textContent = `${f.length} canciones · Género`
  renderList(f, 'sg'); setView('lv'); setNav(null); closeSb()
}
function showMood(mk) {
  const f = S.filter(s => s.m.includes(mk)); q = f; qi = 0
  document.getElementById('vtl').textContent = MOODS[mk]?.l || mk
  document.getElementById('vsb').textContent = `${f.length} canciones · Mood`
  renderList(f, 'sg'); setView('lv'); setNav(null); closeSb()
}
function doSearch(v) {
  if (!v.trim()) { showHome(); return }
  const r = S.filter(s =>
    s.t.toLowerCase().includes(v.toLowerCase()) ||
    s.a.toLowerCase().includes(v.toLowerCase()) ||
    s.g.toLowerCase().includes(v.toLowerCase()))
  q = r; qi = 0
  document.getElementById('stl2').textContent = `"${v}"`
  document.getElementById('ssb2').textContent = `${r.length} resultado${r.length !== 1 ? 's' : ''}`
  renderList(r, 'sr2'); setView('sv'); setNav(null)
}

/* ── SIDEBAR MOBILE ── */
function toggleSb() {
  const s = document.getElementById('sb'), o = document.getElementById('ov')
  const open = s.classList.toggle('open')
  o.classList.toggle('show', open)
}
function closeSb() {
  document.getElementById('sb').classList.remove('open')
  document.getElementById('ov').classList.remove('show')
}

/* ── KEYBOARD SHORTCUTS ── */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return
  if (e.code === 'Space') { e.preventDefault(); togglePlay() }
  if (e.code === 'ArrowRight') nextS()
  if (e.code === 'ArrowLeft')  prevS()
})

/* ── INIT ── */
window.onload = () => {
  greet()
  renderSidebar()
  renderHome()
  showHome()
  loadYT()
}
</script>

<div id="ytwrp"><div id="ytpl"></div></div>
</body>
</html>
