<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Jordy Vibes</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0c0c;--surface:#161616;--border:rgba(255,255,255,.07);
  --muted:rgba(255,255,255,.32);--text:#ede8e0;
  --accent:#c8b49a;--accent2:#e5d9c8;
  --sidebar-w:230px;--player-h:70px;--header-h:50px;--r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden;}

/* LAYOUT */
.app{display:grid;grid-template-rows:var(--header-h) 1fr var(--player-h);grid-template-columns:var(--sidebar-w) 1fr;grid-template-areas:"hd hd""sb mn""pl pl";height:100vh;}

/* HEADER */
header{grid-area:hd;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:rgba(12,12,12,.96);backdrop-filter:blur(20px);z-index:200;}
.logo{font-family:'Instrument Serif',serif;font-size:17px;color:var(--accent2);}
.hright{display:flex;align-items:center;gap:12px;}
.swrap{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:0 12px;height:30px;transition:border-color .2s;}
.swrap:focus-within{border-color:var(--accent);}
.swrap input{background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:180px;}
.swrap input::placeholder{color:var(--muted);}
.upill{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;}
.odot{width:6px;height:6px;background:#5cb85c;border-radius:50%;}
.mbtn{display:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;}

/* SIDEBAR */
aside{grid-area:sb;background:#111;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s cubic-bezier(.4,0,.2,1);}
.sscroll{flex:1;overflow-y:auto;padding-bottom:12px;}
.sscroll::-webkit-scrollbar{width:0;}
.ns{padding:16px 14px 6px;}
.nsl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 8px;margin-bottom:5px;}
.ni{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;transition:background .12s,color .12s;}
.ni:hover{background:var(--surface);color:var(--text);}
.ni.active{background:rgba(200,180,154,.1);color:var(--accent2);}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--surface);color:var(--muted);}
.sfoot{padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}
.expbtn{cursor:pointer;transition:color .15s;}.expbtn:hover{color:var(--accent);}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:299;backdrop-filter:blur(2px);}

/* MAIN */
main{grid-area:mn;overflow-y:auto;scroll-behavior:smooth;}
main::-webkit-scrollbar{width:4px;}
main::-webkit-scrollbar-track{background:transparent;}
main::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* VIEWS */
.view{display:none;}.view.active{display:block;}

/* HOME */
.hero{padding:44px 32px 36px;border-bottom:1px solid var(--border);}
.hlbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
.htitle{font-family:'Instrument Serif',serif;font-size:42px;line-height:1.05;color:var(--accent2);}
.hsub{font-size:14px;color:var(--muted);margin-top:7px;font-weight:300;}
.sec{padding:28px 32px;}.sec+.sec{padding-top:0;}
.seclbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 14px;cursor:pointer;transition:border-color .2s,transform .2s;}
.gcard:hover{border-color:var(--accent);transform:translateY(-2px);}
.gletter{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;margin-bottom:10px;}
.gname{font-size:12px;font-weight:500;color:var(--text);}
.gcnt{font-size:11px;color:var(--muted);margin-top:3px;}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 8px;cursor:pointer;text-align:center;transition:border-color .2s,transform .2s;}
.mcard:hover{border-color:var(--accent);transform:translateY(-2px);}
.mdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin:0 auto 7px;}
.mlbl{font-size:11px;color:var(--muted);}

/* LIST HEADER */
.lhd{position:sticky;top:0;background:rgba(12,12,12,.96);backdrop-filter:blur(16px);padding:20px 32px;border-bottom:1px solid var(--border);z-index:50;display:flex;align-items:center;justify-content:space-between;}
.bbtn{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--muted);font-size:12px;transition:color .15s;background:none;border:none;}
.bbtn:hover{color:var(--text);}
.vtitle{font-family:'Instrument Serif',serif;font-size:28px;color:var(--accent2);line-height:1;margin-top:7px;}
.vsub{font-size:11px;color:var(--muted);margin-top:4px;}
.paybtn{display:flex;align-items:center;gap:7px;background:var(--accent);color:#0c0c0c;border:none;border-radius:7px;padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:opacity .15s,transform .15s;white-space:nowrap;}
.paybtn:hover{opacity:.85;transform:scale(1.02);}

/* SONGS */
.swrp{padding:12px 32px 24px;}
.srow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:14px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:background .12s;}
.srow:hover{background:var(--surface);}
/* hide number on hover, show play button — no overlapping */
.srow:hover .snum{visibility:hidden;}
.srow:hover .splay{visibility:visible;}
.srow.playing{background:rgba(200,180,154,.07);}
.srow.playing .stitle{color:var(--accent);}
.ncell{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.snum{font-size:11px;color:var(--muted);position:absolute;}
.splay{font-size:11px;color:var(--text);position:absolute;visibility:hidden;background:none;border:none;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.stitle{font-size:13px;font-weight:400;color:var(--text);}
.sartist{font-size:11px;color:var(--muted);margin-top:2px;}
.stags{display:flex;gap:3px;flex-wrap:wrap;}
.stag{font-size:9px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
.allhd{padding:36px 32px 14px;}
.alltitle{font-family:'Instrument Serif',serif;font-size:34px;color:var(--accent2);}
.allsub{font-size:12px;color:var(--muted);margin-top:5px;}
.empty{padding:50px 0;text-align:center;color:var(--muted);font-size:13px;}

/* PLAYER */
#pbar{grid-area:pl;background:rgba(18,18,18,.98);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;z-index:200;transition:opacity .3s;}
#pbar.idle{opacity:.35;pointer-events:none;}
.pinfo{display:flex;align-items:center;gap:12px;min-width:0;}
.pthumb{width:38px;height:38px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent);font-family:'DM Sans',sans-serif;}
.ptitle{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.partist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.pctrl{display:flex;flex-direction:column;align-items:center;gap:6px;}
.crow{display:flex;align-items:center;gap:18px;}
.cbtn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;transition:color .15s,transform .1s;}
.cbtn:hover{color:var(--text);transform:scale(1.1);}
.pmain{width:32px;height:32px;border-radius:50%;background:var(--accent2);border:none;color:#0c0c0c;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;}
.pmain:hover{transform:scale(1.08);}
.pmain:active{transform:scale(.95);}
.prow{display:flex;align-items:center;gap:8px;width:100%;max-width:380px;}
.ptime{font-size:10px;color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums;}
.ptrack{flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:2px;position:relative;cursor:pointer;}
.pfill{height:100%;background:var(--accent);border-radius:2px;width:0%;pointer-events:none;}
.pthb{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--accent2);left:0%;opacity:0;pointer-events:none;transition:opacity .2s;}
.ptrack:hover .pthb{opacity:1;}
.prgt{display:flex;align-items:center;justify-content:flex-end;gap:12px;}
.vwrap{display:flex;align-items:center;gap:7px;}
.vsl{-webkit-appearance:none;width:70px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);outline:none;cursor:pointer;}
.vsl::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent2);cursor:pointer;}
.cpl{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;transition:color .15s;}.cpl:hover{color:var(--text);}

/* MOBILE */
@media(max-width:680px){
  .app{grid-template-rows:var(--header-h) 1fr var(--player-h);grid-template-columns:1fr;grid-template-areas:"hd""mn""pl";}
  aside{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:300;transform:translateX(-100%);}
  aside.open{transform:translateX(0);}
  .overlay{display:block;}
  .overlay.hidden{display:none;}
  .mbtn{display:flex;}
  .swrap input{width:110px;}
  .upill span{display:none;}
  .hero{padding:26px 18px 22px;}.htitle{font-size:28px;}
  .sec{padding:18px;}.sec+.sec{padding-top:0;}
  .ggrid{grid-template-columns:repeat(2,1fr);}
  .mgrid{grid-template-columns:repeat(3,1fr);}
  .lhd{padding:14px 18px;flex-wrap:wrap;gap:10px;}
  .swrp{padding:10px 14px 20px;}
  .srow{grid-template-columns:24px 1fr;}
  .stags{display:none;}
  .allhd{padding:22px 18px 10px;}
  #pbar{grid-template-columns:1fr auto;padding:0 12px;gap:8px;}
  .prgt{display:none;}
  .prow{max-width:200px;}
  .ptitle{max-width:90px;}.partist{max-width:90px;}
}
#ytwrap{position:fixed;bottom:100px;right:0;width:0;height:0;overflow:hidden;pointer-events:none;}
</style>
</head>
<body>
<div class="app">

<header>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="mbtn" onclick="toggleSb()" aria-label="Menú">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
        <rect y="0"  width="18" height="2" rx="1" fill="currentColor"/>
        <rect y="6"  width="12" height="2" rx="1" fill="currentColor"/>
        <rect y="12" width="18" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
    <div class="logo">Jordy Vibes</div>
  </div>
  <div class="hright">
    <div class="swrap">
      <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>
        <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input type="text" id="sinput" placeholder="Buscar..." oninput="doSearch(this.value)"/>
    </div>
    <div class="upill"><div class="odot"></div><span>Jordy · EC</span></div>
  </div>
</header>

<div class="overlay hidden" id="overlay" onclick="closeSb()"></div>

<aside id="sidebar">
  <div class="sscroll">
    <div class="ns">
      <div class="ni active" id="nav-home" onclick="showHome()">Inicio</div>
      <div class="ni" id="nav-all" onclick="showAll()">
        Todas las canciones<span class="badge">100</span>
      </div>
    </div>
    <div class="ns"><div class="nsl">Géneros</div><div id="glist"></div></div>
    <div class="ns"><div class="nsl">Moods</div><div id="mlist"></div></div>
  </div>
  <div class="sfoot">
    <span>100 canciones</span>
    <span class="expbtn" onclick="alert('Demo: exportaría a Spotify')">Exportar →</span>
  </div>
</aside>

<main id="main">
  <!-- HOME -->
  <div id="home-view" class="view active">
    <div class="hero">
      <div class="hlbl">Tu espacio</div>
      <div class="htitle" id="gtitle">Buenas noches,<br/>Lesly.</div>
      <div class="hsub" id="gsub">¿Qué mood traes hoy?</div>
    </div>
    <div class="sec"><div class="seclbl">Géneros</div><div class="ggrid" id="fgenres"></div></div>
    <div class="sec"><div class="seclbl">Moods</div><div class="mgrid" id="fmoods"></div></div>
  </div>

  <!-- LIST -->
  <div id="list-view" class="view">
    <div class="lhd">
      <div>
        <button class="bbtn" onclick="showHome()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 1.5L3.5 6L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Volver
        </button>
        <div class="vtitle" id="vtitle"></div>
        <div class="vsub" id="vsub"></div>
      </div>
      <button class="paybtn" onclick="playAll()">
        <svg width="9" height="11" viewBox="0 0 9 11" fill="currentColor"><path d="M0 0L9 5.5L0 11V0Z"/></svg>
        Reproducir todo
      </button>
    </div>
    <div class="swrp" id="sgrid"></div>
  </div>

  <!-- ALL -->
  <div id="all-view" class="view">
    <div class="allhd"><div class="alltitle">Todas las canciones</div><div class="allsub">100 canciones · Tu biblioteca</div></div>
    <div class="swrp" id="alist"></div>
  </div>

  <!-- SEARCH -->
  <div id="search-view" class="view">
    <div class="lhd">
      <div>
        <button class="bbtn" onclick="showHome()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 1.5L3.5 6L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Volver
        </button>
        <div class="vtitle" id="stitle">Resultados</div>
        <div class="vsub" id="ssub"></div>
      </div>
    </div>
    <div class="swrp" id="sresults"></div>
  </div>
</main>

<!-- PLAYER -->
<div id="pbar" class="idle">
  <div class="pinfo">
    <div class="pthumb" id="pthumb">—</div>
    <div><div class="ptitle" id="ptitle">—</div><div class="partist" id="partist">Selecciona una canción</div></div>
  </div>
  <div class="pctrl">
    <div class="crow">
      <button class="cbtn" onclick="prevS()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><path d="M2 2h1.4v11H2zM4.4 7.5L12 2v11L4.4 7.5z"/></svg>
      </button>
      <button class="pmain" id="pmain" onclick="togglePlay()">
        <svg id="picon" width="11" height="13" viewBox="0 0 11 13" fill="currentColor"><path d="M0 0L11 6.5L0 13V0Z"/></svg>
      </button>
      <button class="cbtn" onclick="nextS()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><path d="M13 2h-1.4v11H13zM10.6 7.5L3 2v11l7.6-5.5z"/></svg>
      </button>
    </div>
    <div class="prow">
      <span class="ptime" id="tcur">0:00</span>
      <div class="ptrack" id="ptrack" onclick="seek(event)">
        <div class="pfill" id="pfill"></div>
        <div class="pthb" id="pthb"></div>
      </div>
      <span class="ptime" style="text-align:right" id="tdur">—</span>
    </div>
  </div>
  <div class="prgt">
    <div class="vwrap">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M1 4.5h2.5L6 2v9L3.5 8.5H1V4.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M8.5 3.5a4 4 0 010 6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <input type="range" class="vsl" id="vsl" min="0" max="100" value="80" oninput="setVol(this.value)"/>
    </div>
    <button class="cpl" onclick="closeP()">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
</div>

<div id="ytwrap"><div id="yt-player"></div></div>

const MOODS={
  feliz:     {l:"Feliz",     c:"#e8c040"},
  chill:     {l:"Chill",     c:"#5aabb8"},
  nocturnas: {l:"Nocturnas", c:"#7b6bb0"},
  tristes:   {l:"Tristes",   c:"#8080a0"},
  energicas: {l:"Enérgicas", c:"#d05030"},
  romanticas:{l:"Románticas",c:"#c07878"},
  dance:     {l:"Dance",     c:"#48b870"},
}
const GC={
  "Hip-Hop":"#c8945a","R&B":"#c06878","Rock":"#6888c0","Pop":"#8888c0",
  "Latin":"#78b878","Electronic":"#5898c0","Funk":"#c0a048","Disco":"#b870a8",
  "New Wave":"#60a8b0","Classic":"#a08060",
}
const genres=[...new Set(S.map(s=>s.g))]

/* ── STATE ── */
let yt=null,ytOk=false
let curSong=null,queue=[],qi=-1,playing=false
let tickId=null,fakeId=null

/* ── GREETING ── */
function greet(){
  const h=new Date().getHours()
  let p,sub
  if(h>=5&&h<12){p="Buenos días";sub="Arranca el día con buena vibra."}
  else if(h>=12&&h<19){p="Buenas tardes";sub="¿Qué mood traes esta tarde?"}
  else{p="Buenas noches";sub="¿Qué mood traes hoy?"}
  document.getElementById('gtitle').innerHTML=`${p},<br/>Lesly.`
  document.getElementById('gsub').textContent=sub
}

/* ── YT ── */
function loadYT(){
  const sc=document.createElement('script')
  sc.src='https://www.youtube.com/iframe_api'
  document.body.appendChild(sc)
}
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('yt-player',{
    height:'1',width:'1',
    playerVars:{autoplay:0,controls:0,rel:0,playsinline:1},
    events:{onReady:()=>{ytOk=true},onStateChange:onSC}
  })
}
function onSC(e){
  if(e.data===YT.PlayerState.ENDED){nextS();return}
  if(e.data===YT.PlayerState.PLAYING){playing=true;updIcon();startTick()}
  if(e.data===YT.PlayerState.PAUSED){playing=false;updIcon();stopTick()}
}

/* ── PROGRESS ── */
function startTick(){stopTick();tickId=setInterval(tick,400)}
function stopTick(){clearInterval(tickId)}
function tick(){
  if(!yt||!yt.getDuration)return
  const dur=yt.getDuration()||0,cur=yt.getCurrentTime()||0
  if(!dur)return
  setP((cur/dur)*100,cur,dur)
}
function setP(pct,cur,dur){
  document.getElementById('pfill').style.width=pct+'%'
  document.getElementById('pthb').style.left=pct+'%'
  document.getElementById('tcur').textContent=fmt(cur)
  document.getElementById('tdur').textContent=fmt(dur)
}
function fmt(s){const m=Math.floor(s/60),sc=Math.floor(s%60);return`${m}:${sc.toString().padStart(2,'0')}`}
function seek(e){
  if(!yt||!yt.getDuration)return
  const r=document.getElementById('ptrack').getBoundingClientRect()
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))
  yt.seekTo(yt.getDuration()*pct,true)
}
function setVol(v){if(yt&&yt.setVolume)yt.setVolume(+v)}

/* ── PLAYBACK ── */
function play(songOrId){
  const song=typeof songOrId==='number'?S.find(s=>s.id===songOrId):songOrId
  if(!song)return
  curSong=song
  document.getElementById('pbar').classList.remove('idle')
  document.getElementById('pthumb').textContent=song.g[0]
  document.getElementById('pthumb').style.color=GC[song.g]||'var(--accent)'
  document.getElementById('ptitle').textContent=song.t
  document.getElementById('partist').textContent=song.a
  setP(0,0,0)
  document.getElementById('tdur').textContent='—'
  document.querySelectorAll('.srow').forEach(r=>r.classList.remove('playing'))
  document.querySelector(`.srow[data-id="${song.id}"]`)?.classList.add('playing')
  if(song.y&&ytOk){
    clearInterval(fakeId)
    yt.loadVideoById(song.y)
    yt.setVolume(+document.getElementById('vsl').value)
    playing=true
  } else {
    playing=true;runFake(225)
  }
  updIcon()
}
function runFake(total){
  stopTick();clearInterval(fakeId)
  let e=0
  document.getElementById('tdur').textContent=fmt(total)
  fakeId=setInterval(()=>{
    if(!playing)return
    e++;setP((e/total)*100,e,total)
    if(e>=total){clearInterval(fakeId);nextS()}
  },1000)
}
function togglePlay(){
  if(!curSong)return
  if(curSong.y&&ytOk){playing?yt.pauseVideo():yt.playVideo()}
  else{playing=!playing;updIcon()}
}
function updIcon(){
  const ic=document.getElementById('picon')
  if(playing){
    ic.innerHTML='<rect x="0" y="0" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="7.5" y="0" width="3.5" height="13" rx="1" fill="currentColor"/>'
  }else{
    ic.innerHTML='<path d="M0 0L11 6.5L0 13V0Z"/>'
  }
}
function nextS(){
  if(!queue.length)return
  qi=(qi+1)%queue.length;play(queue[qi])
}
function prevS(){
  if(!queue.length)return
  qi=(qi-1+queue.length)%queue.length;play(queue[qi])
}
function closeP(){
  if(ytOk&&yt.stopVideo)yt.stopVideo()
  stopTick();clearInterval(fakeId)
  playing=false;curSong=null
  document.getElementById('pbar').classList.add('idle')
  document.getElementById('ptitle').textContent='—'
  document.getElementById('partist').textContent='Selecciona una canción'
  document.getElementById('pthumb').textContent='—'
  setP(0,0,0)
  document.getElementById('tdur').textContent='—'
  document.querySelectorAll('.srow').forEach(r=>r.classList.remove('playing'))
  updIcon()
}
function playAll(){if(queue.length){qi=0;play(queue[0])}}
function qplay(id){
  const idx=queue.findIndex(s=>s.id===id)
  if(idx!==-1)qi=idx
  play(id);closeSb()
}

/* ── RENDER ── */
function renderSidebar(){
  const gl=document.getElementById('glist')
  gl.innerHTML=''
  genres.forEach(g=>{
    const n=S.filter(s=>s.g===g).length
    const d=document.createElement('div')
    d.className='ni';d.innerHTML=`<span>${g}</span><span class="badge">${n}</span>`
    d.onclick=()=>showGenre(g);gl.appendChild(d)
  })
  const ml=document.getElementById('mlist')
  ml.innerHTML=''
  Object.entries(MOODS).forEach(([k,mo])=>{
    const n=S.filter(s=>s.m.includes(k)).length
    const d=document.createElement('div')
    d.className='ni';d.innerHTML=`<span>${mo.l}</span><span class="badge">${n}</span>`
    d.onclick=()=>showMood(k);ml.appendChild(d)
  })
}
function renderHome(){
  const fg=document.getElementById('fgenres')
  fg.innerHTML=''
  genres.forEach(g=>{
    const n=S.filter(s=>s.g===g).length,col=GC[g]||'#a09080'
    fg.innerHTML+=`<div class="gcard" onclick="showGenre('${g}')">
      <div class="gletter" style="background:${col}20;color:${col}">${g[0]}</div>
      <div class="gname">${g}</div><div class="gcnt">${n} canciones</div></div>`
  })
  const fm=document.getElementById('fmoods')
  fm.innerHTML=''
  Object.entries(MOODS).forEach(([k,mo])=>{
    fm.innerHTML+=`<div class="mcard" onclick="showMood('${k}')">
      <div class="mdot" style="background:${mo.c}25;color:${mo.c}">${mo.l[0]}</div>
      <div class="mlbl">${mo.l}</div></div>`
  })
}
function renderList(list,cid){
  const c=document.getElementById(cid)
  c.innerHTML=''
  if(!list.length){c.innerHTML='<div class="empty">Sin canciones aquí.</div>';return}
  list.forEach((song,i)=>{
    const row=document.createElement('div')
    row.className='srow'
    row.dataset.id=song.id
    // Using separate absolutely-positioned elements avoids the overlap/visibility bug
    row.innerHTML=`
      <div class="ncell">
        <span class="snum">${i+1}</span>
        <button class="splay" onclick="event.stopPropagation();qplay(${song.id})">&#9654;</button>
      </div>
      <div>
        <div class="stitle">${song.t}${!song.y?'<span style="font-size:9px;opacity:.35;margin-left:6px">sin audio</span>':''}</div>
        <div class="sartist">${song.a}</div>
      </div>
      <div class="stags">${song.m.map(mk=>`<span class="stag">${MOODS[mk]?.l||mk}</span>`).join('')}</div>`
    row.addEventListener('click',()=>qplay(song.id))
    c.appendChild(row)
  })
}

/* ── VIEWS ── */
function setView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  document.getElementById('main').scrollTop=0
}
function setNav(id){
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'))
  if(id)document.getElementById(id)?.classList.add('active')
}
function showHome(){
  setView('home-view');setNav('nav-home')
  queue=[...S]
  document.getElementById('sinput').value=''
  closeSb()
}
function showAll(){
  setView('all-view');setNav('nav-all')
  queue=[...S];qi=0
  renderList(S,'alist');closeSb()
}
function showGenre(g){
  const f=S.filter(s=>s.g===g);queue=f;qi=0
  document.getElementById('vtitle').textContent=g
  document.getElementById('vsub').textContent=`${f.length} canciones · Género`
  renderList(f,'sgrid');setView('list-view');setNav(null);closeSb()
}
function showMood(mk){
  const f=S.filter(s=>s.m.includes(mk));queue=f;qi=0
  document.getElementById('vtitle').textContent=MOODS[mk]?.l||mk
  document.getElementById('vsub').textContent=`${f.length} canciones · Mood`
  renderList(f,'sgrid');setView('list-view');setNav(null);closeSb()
}
function doSearch(q){
  if(!q.trim()){showHome();return}
  const r=S.filter(s=>s.t.toLowerCase().includes(q.toLowerCase())||s.a.toLowerCase().includes(q.toLowerCase())||s.g.toLowerCase().includes(q.toLowerCase()))
  queue=r;qi=0
  document.getElementById('stitle').textContent=`"${q}"`
  document.getElementById('ssub').textContent=`${r.length} resultado${r.length!==1?'s':''}`
  renderList(r,'sresults');setView('search-view');setNav(null)
}

/* ── MOBILE SIDEBAR ── */
function toggleSb(){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay')
  const o=sb.classList.toggle('open')
  ov.classList.toggle('hidden',!o)
}
function closeSb(){
  document.getElementById('sidebar').classList.remove('open')
  document.getElementById('overlay').classList.add('hidden')
}

/* ── INIT ── */
window.onload=()=>{greet();renderSidebar();renderHome();showHome();loadYT()}
</script>
